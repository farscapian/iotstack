# iotstack-devices.conf
# Device name mappings for simplified CLI usage
#
# Format: DEVICE_NAME=wifi_yaml:thread_yaml
# - wifi_yaml: path to WiFi variant (optional, leave empty if N/A)
# - thread_yaml: path to Thread variant (optional, leave empty if N/A)
# - Default variant is WiFi. Use --thread flag to switch.
#
# Example:
#   bleproxy=wifi/esp32c6-wifi-bleproxy.yaml:
#   mmwave=wifi/esp32c6-wifi-mmwave.yaml:
#   thread_router=:thread/c6-thread-router.yaml
#
# Usage:
#   iotstack update bleproxy              # updates WiFi variant
#   iotstack update bleproxy --thread     # updates Thread variant
#   iotstack verify mmwave
#   iotstack list

# WiFi Devices
bleproxy=wifi/esp32c6-wifi-bleproxy.yaml:
mmwave=wifi/esp32c6-wifi-mmwave.yaml:
sendspin=wifi-sendspin.yaml:

# Thread Devices
thread_router=:thread/c6-thread-router.yaml

# Device aliases (shortcuts)
proxy=bleproxy
motion=mmwave
router=thread_router
