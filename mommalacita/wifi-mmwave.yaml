# mmwave-wifi.yaml

substitutions:
  name: "wifi-mmwave"
  friendly_name: "wifi-mmwave mmWave"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  min_version: "2025.6.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 20%

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# 1. Core services

logger:
  level: DEBUG

api:
  on_client_connected:
    - light.turn_on:
        id: rgb_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 20%
        transition_length: 500ms
  on_client_disconnected:
    - light.turn_on:
        id: rgb_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 20%
        transition_length: 500ms

ota:
  - platform: esphome

mdns:
  disabled: false

# 2. Wi-Fi networking

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_password

captive_portal:

# 3. Hardware buses

uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: GPIO17
  tx_pin: GPIO16
  parity: NONE
  stop_bits: 1

i2c:
  id: bus_a
  sda: GPIO22
  scl: GPIO23
  scan: true

# 4. mmWave component

seeed_mr60bha2:
  id: mr60bha2
  uart_id: uart_bus

# 5. Sensors

binary_sensor:
  - platform: seeed_mr60bha2
    has_target:
      name: "Person Information"
      id: presence
      on_press:
        - light.turn_on:
            id: rgb_led
            red: 0%
            green: 0%
            blue: 100%
            brightness: 15%
            transition_length: 300ms
      on_release:
        - if:
            condition:
              api.connected:
            then:
              - light.turn_on:
                  id: rgb_led
                  red: 0%
                  green: 100%
                  blue: 0%
                  brightness: 20%
                  transition_length: 500ms
            else:
              - light.turn_on:
                  id: rgb_led
                  red: 100%
                  green: 0%
                  blue: 0%
                  brightness: 20%
                  transition_length: 500ms

sensor:
  - platform: seeed_mr60bha2
    breath_rate:
      name: "Real-time respiratory rate"
      unit_of_measurement: "breaths/min"
      accuracy_decimals: 1
      filters:
        - filter_out: 0.0
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    heart_rate:
      name: "Real-time heart rate"
      unit_of_measurement: "bpm"
      accuracy_decimals: 1
      filters:
        - filter_out: 0.0
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    distance:
      name: "Distance to detection object"
      unit_of_measurement: "in"
      accuracy_decimals: 1
      filters:
        - multiply: 0.0393701  # mm to inches
    num_targets:
      name: "Target Number"

  - platform: bh1750
    i2c_id: bus_a
    name: "mmWave Illuminance"
    address: 0x23
    update_interval: 10s
    unit_of_measurement: "lx"
    accuracy_decimals: 1

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

# 6. RGB LED (WS2812, single pixel, GPIO1)

light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: "mmWave RGB Light"
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF