# roles.conf -- Device role manifest
#
# Format: DEVICE_ROLE=yaml_path
# Network type (WiFi or Thread) is determined by introspecting the YAML file.
# - If YAML contains "wifi:" section -> WiFi device
# - If YAML contains "openthread:" section -> Thread device
#
# Usage:
#   iotstack update bleproxy              # update device
#   iotstack verify mmwave
#   iotstack update all                   # update all roles listed here

# Device roles (network type auto-detected from YAML)
#
# Role naming: roles with multiple hardware/network builds use a
# <role>-<chip>-<network> qualifier so each (chip x network) is unambiguous.
# ledlightstrip family: same SK6812 RGBW strip, esp-idf + esp32_rmt_led_strip
# (neopixelbus dropped -- deprecated for ESP32 in ESPHome 2026.6, won't build
# under ESP-IDF 6).
#   ledlightstrip-c6-thread  XIAO ESP32-C6, Thread
#   ledlightstrip-s3-wifi    XIAO ESP32-S3, WiFi
bleproxy=yamls/bleproxy.yaml
mmwave=yamls/mmwave.yaml
sendspinspeaker=yamls/sendspinspeaker.yaml
ledlightstrip-c6-thread=yamls/ledlightstrip-c6-thread.yaml
ledlightstrip-s3-wifi=yamls/ledlightstrip-s3-wifi.yaml
threadrouter=yamls/threadrouter.yaml
silentnotify=yamls/silentnotify.yaml
matrixdisplay=yamls/matrixdisplay.yaml
