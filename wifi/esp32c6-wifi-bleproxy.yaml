# BLE Proxy - WiFi Only (C6 Device)
# ESPHome 2026.5.x compatible
# Uses stable role UUID for device name (not changed by reassignment)
# MAC suffix appended to make device-specific identifier
substitutions:
  role_id: "f9ae844f309077c78b"  # Stable identifier for this role (18 chars + 6 MAC = 24 char hostname)
  friendly_name: "WiFi BLEProxy"  # Display name, can change without breaking entities

esphome:
  name: ${role_id}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true  # Results in: role_id<MAC> (32 chars total)
  project:
    name: "farscapian.${friendly_name}"
    version: "1.3.0"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret api_encryption_key

esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true
  connection_slots: 4

#signed_ota_verification:
#  signing_key: !secret ota_signing_key
ota:
  - platform: esphome
    id: my_ota
    password: !secret ota_password_01

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

binary_sensor:
  - platform: status
    name: "Connection Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: safe_mode
    name: "Restart in Safe Mode"
  - platform: restart
    name: "Restart"
  - platform: factory_reset
    name: "Factory Reset"

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
