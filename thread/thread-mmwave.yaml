# mmwave-thread.yaml

substitutions:
  device_id: "thread-mmwave"          # Legacy name for mDNS transition
  device_name: "c6-thread-mmwave"     # New esphome.name
  friendly_name: "${device_name}"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: farscapian.${device_id}
    version: 1.0.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 20%

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# 1. Core services

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret mmwave_apiencryption_key_thread
  on_client_connected:
    - light.turn_on:
        id: rgb_led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 20%
        transition_length: 500ms
  on_client_disconnected:
    - light.turn_on:
        id: rgb_led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 20%
        transition_length: 500ms

ota:
  - platform: esphome

http_request:

time:
  - platform: sntp
    id: device_time

# 2. Thread networking

network:
  enable_ipv6: true

openthread:
  device_type: FTD
  tlv: !secret thread_tlv

# 3. Hardware buses

uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: GPIO17
  tx_pin: GPIO16
  parity: NONE
  stop_bits: 1

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: false

# 4. mmWave component

seeed_mr60bha2:
  id: mr60bha2
  uart_id: uart_bus

# 5. Sensors

binary_sensor:
  - platform: seeed_mr60bha2
    has_target:
      name: "Presence"
      id: presence
      on_press:
        - light.turn_on:
            id: rgb_led
            red: 0%
            green: 0%
            blue: 100%
            brightness: 15%
            transition_length: 300ms
      on_release:
        - if:
            condition:
              api.connected:
            then:
              - light.turn_on:
                  id: rgb_led
                  red: 0%
                  green: 100%
                  blue: 0%
                  brightness: 20%
                  transition_length: 500ms
            else:
              - light.turn_on:
                  id: rgb_led
                  red: 100%
                  green: 0%
                  blue: 0%
                  brightness: 20%
                  transition_length: 500ms

sensor:
  - platform: seeed_mr60bha2
    breath_rate:
      name: "Respiratory Rate"
      unit_of_measurement: "breaths/min"
      accuracy_decimals: 1
      filters:
        - filter_out: 0.0
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    heart_rate:
      name: "Heart Rate"
      unit_of_measurement: "bpm"
      accuracy_decimals: 1
      filters:
        - filter_out: 0.0
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
    distance:
      name: "Detection Distance"
      unit_of_measurement: "in"
      accuracy_decimals: 1
      filters:
        - multiply: 39.3701  # m to inches
    num_targets:
      name: "Target Count"

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    update_interval: 60s

# 7. Buttons

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config

# 7. RGB LED (onboard WS2812, GPIO1)

light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: "Status LED"
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF