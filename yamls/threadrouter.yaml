# ESP32-C6 Thread Router
substitutions:
  development_status: "prod"
  dev_status: "${development_status}"
  device_role: "threadrouter"
  friendly_name: "Thread Router"

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}-${dev_status}"
    version: "1.5.0"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6
  partitions: iotstack_partition_table.csv

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

# Thread configuration.
# tlv: is a PLACEHOLDER complete dataset — all values are fake and will never
# match any real Thread network. It exists only to satisfy ESPHome's config
# validator (which requires network_key or tlv) and to give
# esp_openthread_auto_start() a syntactically valid TLV so the stack starts
# without crashing. nvs_secrets then applies the REAL operational dataset from
# NVS (key: thread_tlv) at runtime via otDatasetSetActiveTlvs(), and the
# device joins the real Thread network.
# force_dataset: false so a previously stored real dataset is not clobbered.
openthread:
  device_type: FTD
  force_dataset: false
  tlv: "0e080000000000000001000300000f0102beef0208dead00beef00cafe0314696f74737461636b2d706c616365686f6c646572041000000000000000000000000000000000051000112233445566778899aabbccddeeff0708fd112233445566770c0402a0f8ff"

# 3. Network — required for IPv6/Thread
network:
  enable_ipv6: true

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

# 4. API — native ESPHome over IPv6/Thread (OTA is failsafe-only)
api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

# 5. Logger
logger:
  baud_rate: 115200
  # USB serial only; disable (baud_rate: 0) after initial setup if desired

# 8. Onboard LED — XIAO ESP32-C6 GPIO15, active-low
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: onboard_led_output

light:
  - platform: binary
    name: "Onboard LED"
    output: onboard_led_output
    id: led

time:
  - platform: sntp
    id: device_time

# 9. Uptime sensor
sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

# 10. OpenThread info text sensors
text_sensor:
  - platform: openthread_info
    role:
      name: "Thread Role"
      icon: "mdi:thread-outline"
      entity_category: diagnostic
    ip_address:
      name: "Thread IPv6 Address"
      icon: "mdi:ip-network"
      entity_category: diagnostic
    channel:
      name: "Thread Channel"
      entity_category: diagnostic
    network_name:
      name: "Thread Network Name"
      entity_category: diagnostic
    rloc16:
      name: "Thread RLOC16"
      entity_category: diagnostic
    # network_key: omitted — exposes sensitive credentials

# Buttons: "Restart" and "Toggle Boot Partition" come from partition_mgmt package.
