# BLE Proxy - WiFi Only (C6 Device)
# ESPHome 2026.5.x compatible

substitutions:
  development_status: "prod"
  dev_status: "${development_status}"
  device_role: "bleproxy"
  friendly_name: "Bluetooth Proxy"


# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}-${dev_status}"
    version: "1.5.0"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
# YAML does not contain any secrets - all come from device flash (NVS)
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component
  power_save_mode: none

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS
  # No hardcoded key in firmware binary

esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true
  connection_slots: 4

# OTA Configuration
# Password is dynamically set by nvs_secrets component from NVS
ota:
  - platform: esphome

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

binary_sensor:
  - platform: status
    name: "Connection Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI (dBm)"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: factory_reset
    name: "Factory Reset"
  # "Restart" and "Toggle Boot Partition" buttons come from partition_mgmt package

# Status LED - Onboard LED on XIAO ESP32-C6 (GPIO15, active-low)
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: onboard_led_output

light:
  - platform: binary
    name: "Status LED"
    output: onboard_led_output
    id: status_led

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
