# BLE Proxy - WiFi Only (C6 Device)
# ESPHome 2026.5.x compatible

substitutions:
  device_role: "bleproxy"
  friendly_name: "Bluetooth Proxy"

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}"
    version: "1.5.0"
  # Include custom NVS components for reading device-specific secrets from flash
  includes:
    - custom_components/nvs_secrets/
    - custom_components/nvs_ota_password/

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
# YAML does not contain any secrets - all come from device flash (NVS)
wifi:
  power_save_mode: none

# Custom NVS secrets component - loads device-specific API key from NVS
nvs_secrets:

# Custom NVS OTA Password component - loads OTA password from NVS at startup
nvs_ota_password:

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS
  # No hardcoded key in firmware binary

esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true
  connection_slots: 4

# OTA Configuration
# Password is set dynamically by nvs_ota_password component from device NVS
ota:
  - platform: esphome

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

binary_sensor:
  - platform: status
    name: "Connection Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI (dBm)"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: safe_mode
    name: "Restart in Safe Mode"
  - platform: restart
    name: "Restart"
  - platform: factory_reset
    name: "Factory Reset"

# Status LED - Onboard LED on XIAO ESP32-C6 (GPIO15, active-low)
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: onboard_led_output

light:
  - platform: binary
    name: "Status LED"
    output: onboard_led_output
    id: status_led

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
