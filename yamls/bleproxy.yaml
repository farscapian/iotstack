# BLE Proxy - WiFi Only (C6 Device)
# ESPHome 2026.5.x compatible

substitutions:
  device_role: "bleproxy"
  friendly_name: "Bluetooth Proxy"

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}"
    version: "1.4.2"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret bleproxy_api_encryption_key

esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true
  connection_slots: 4

ota:
  - platform: esphome
    password: !secret bleproxy_ota_password

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

binary_sensor:
  - platform: status
    name: "Connection Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal (dBm)"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: safe_mode
    name: "Restart in Safe Mode"
  - platform: restart
    name: "Restart"
  - platform: factory_reset
    name: "Factory Reset"

# Status LED - Onboard LED on XIAO ESP32-C6 (GPIO15, active-low)
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: onboard_led_output

light:
  - platform: binary
    name: "Status LED"
    output: onboard_led_output
    id: status_led

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
