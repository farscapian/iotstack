substitutions:
  development_status: "dev"
  dev_status: "${development_status}"
  device_role: "ledstrip"
  friendly_name: "LED Light Strip"


# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets]
esphome:
  name: ledstrip
  friendly_name: ${friendly_name}
  project:
    name: "iotstack.${device_role}-${dev_status}"
    version: 1.0.0
  name_add_mac_suffix: true

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s6
  framework:
    type: arduino
  flash_size: 16MB

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# Custom NVS secrets component - loads device-specific API key from NVS
nvs_secrets:


api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

# OTA Configuration
# Password is dynamically set by nvs_secrets component from NVS
ota:
  - platform: esphome

safe_mode:
  num_attempts: 5
  boot_is_good_after: 60s

logger:
  baud_rate: 115200

time:
  - platform: sntp
    id: device_time

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: safe_mode
    name: "Reboot to Safe Mode"
    entity_category: diagnostic
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

light:
  # Status LED on GPIO21 (user LED)
  - platform: status_led
    name: "Status LED"
    id: led_status
    pin:
      number: GPIO21
      inverted: true

  # SK6812 RGBW LED strip (full RGBW support via Arduino + neopixelbus)
  - platform: neopixelbus
    type: GRBW
    variant: SK6812
    pin: GPIO8
    num_leds: 300
    name: "LED Strip 01"
    id: led_strip_01
    default_transition_length: 500ms
    gamma_correct: 2.8
    restore_mode: RESTORE_AND_ON
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe
      - addressable_scan:
          name: Scan
      - addressable_twinkle:
          name: Twinkle
      - addressable_random_twinkle:
          name: Random Twinkle
      - addressable_fireworks:
          name: Fireworks
      - addressable_flicker:
          name: Flicker
