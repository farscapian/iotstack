substitutions:
  development_status: "dev"
  device_role: "ledstrip"
  friendly_name: "LED Light Strip"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC BOOT button


# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

esphome:
  name: ledstrip
  friendly_name: ${friendly_name}
  project:
    name: "iotstack.${device_role}-${development_status}"
    version: 1.0.0
  name_add_mac_suffix: true

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino
  flash_size: 16MB

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

logger:
  baud_rate: 115200

time:
  - platform: sntp
    id: device_time

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

# Buttons: "Restart" and "Toggle Boot Partition" come from partition_mgmt package.

light:
  # Status LED on GPIO21 (user LED)
  - platform: status_led
    name: "Status LED"
    id: led_status
    pin:
      number: GPIO21
      inverted: true

  # SK6812 RGBW LED strip (full RGBW support via Arduino + neopixelbus)
  - platform: neopixelbus
    type: GRBW
    variant: SK6812
    pin: GPIO8
    num_leds: 300
    name: "LED Strip 01"
    id: led_strip_01
    default_transition_length: 500ms
    gamma_correct: 2.8
    restore_mode: RESTORE_AND_ON
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe
      - addressable_scan:
          name: Scan
      - addressable_twinkle:
          name: Twinkle
      - addressable_random_twinkle:
          name: Random Twinkle
      - addressable_fireworks:
          name: Fireworks
      - addressable_flicker:
          name: Flicker
