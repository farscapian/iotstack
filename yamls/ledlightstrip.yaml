# SK6812 RGBW LED Strip -- Thread end device (XIAO ESP32-C6)
# See docs/ledlightstrip.md for wiring diagram and safety notes.

substitutions:
  development_status: "dev"
  device_role: "ledstrip"
  friendly_name: "LED Light Strip"
  project_version: "0.0.0-dev"
  # LED strip hardware -- override these if your wiring or strip differs
  strip_data_pin: GPIO2   # D0 on XIAO ESP32-C6 silkscreen (via 330 Ohm series resistor to DIN)
  strip_num_leds: "300"
  strip_gamma: "2.8"
  strip_transition: "500ms"

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (default pin: GPIO9 on XIAO ESP32-C6)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

esphome:
  name: ledstrip
  friendly_name: ${friendly_name}
  project:
    name: "iotstack.${device_role}-${development_status}"
    version: "${project_version}"
  name_add_mac_suffix: true

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB

# Thread configuration.
# tlv: is a PLACEHOLDER complete dataset -- all values are fake and satisfy ESPHome's
# config validator only. nvs_secrets applies the REAL operational dataset from NVS
# (key: thread_tlv) at runtime via otDatasetSetActiveTlvs(), and the device joins
# the real Thread network. force_dataset: false so a stored real dataset is not clobbered.
openthread:
  device_type: FTD
  force_dataset: false
  tlv: "0e080000000000000001000300000f0102beef0208dead00beef00cafe0314696f74737461636b2d706c616365686f6c646572041000000000000000000000000000000000051000112233445566778899aabbccddeeff0708fd112233445566770c0402a0f8ff"

network:
  enable_ipv6: true

# Custom NVS secrets component -- reads API key and Thread TLV from NVS at startup
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # Encryption key loaded from NVS by nvs_secrets at runtime

logger:
  hardware_uart: USB_SERIAL_JTAG

time:
  - platform: sntp
    id: device_time

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: openthread_info
    role:
      name: "Thread Role"
      entity_category: diagnostic
    ip_address:
      name: "Thread IPv6 Address"
      entity_category: diagnostic

# Onboard LED -- XIAO ESP32-C6 GPIO15, active-low
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: onboard_led_output

light:
  - platform: binary
    name: "Status LED"
    output: onboard_led_output
    id: status_led

  # SK6812 RGBW addressable strip via RMT peripheral.
  # Wiring: ${strip_data_pin} -> 330 Ohm -> DIN; PSU 5V/20A -> strip VCC; 1000 uF cap at strip input.
  # 3.3V GPIO logic to 5V SK6812 is marginal (threshold ~3.5V at 5V VCC) but works in practice
  # at short data wire runs (< ~2-3m). For longer runs add a 74AHCT125 level shifter before DIN.
  - platform: neopixelbus
    type: GRBW
    variant: SK6812
    pin: ${strip_data_pin}
    num_leds: ${strip_num_leds}
    name: "LED Strip 01"
    id: led_strip_01
    default_transition_length: ${strip_transition}
    gamma_correct: ${strip_gamma}
    restore_mode: RESTORE_AND_ON
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe
      - addressable_scan:
          name: Scan
      - addressable_twinkle:
          name: Twinkle
      - addressable_random_twinkle:
          name: Random Twinkle
      - addressable_fireworks:
          name: Fireworks
      - addressable_flicker:
          name: Flicker
