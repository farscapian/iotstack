substitutions:
  device_role: "matrixdisplay"
  friendly_name: "Matrix Display"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC BOOT button
  heartbeat_interval: "10s"   # bootstrap-only aliveness beacon (see interval: below)
  # Fixed hardware pixel brightness (0-255): panel-wide dimming is no longer a
  # runtime control -- per-style brightness, composed from the "Brightness
  # Levels" box into a style via the "Styles" box (see the display lambda
  # below), is the only brightness knob now. This is a hardware safety
  # ceiling, not a taste setting: raise it only if the panel/PSU can take it.
  matrix_brightness_cap: "170"
  project_version: "0.0.0"

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager, matrix_hub75]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml
  esphome_base: !include common/esphome_base.yaml
  sntp_time: !include common/sntp_time.yaml

esphome:
  name: matrixdisplay

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 16MB


psram:
  mode: octal
 

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key
  # Zero-trust, matches bootstrap.yaml: refuse to run/update without an active PSK
  require_api_encryption: true

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

logger:
  hardware_uart: USB_SERIAL_JTAG

# Font face x size, chosen at runtime via the "roboto"/"mono"/"slab" and
# "small"/"medium"/"large" tokens composed into a style in the "Styles" box
# (see the display lambda below). 3 families (Roboto sans / Roboto Mono /
# Roboto Slab) x 3 sizes (8/14/20).
#
# extras: pulls U+20BF BITCOIN SIGN, plus a set of Unicode emoji, into every font.
# No Roboto family ships those codepoints (FT_Get_Char_Index returns 0), so they
# are sourced from Noto, which does. Naming them under glyphs: makes a missing
# glyph a hard build error, so a bad font swap fails loudly instead of silently
# rendering nothing. "\uXXXX"/"\UXXXXXXXX" are YAML escapes, so this file stays
# ASCII (project rule).
#
# Emoji are plain monochrome glyphs from Noto Emoji (Google Fonts' outline-only
# emoji family, not the color/bitmap "Noto Color Emoji") -- they take the active
# style's color exactly like any other glyph, just at low resolution on the
# panel. This is different from the full-color Bitcoin roundel below, which is a
# two-tone image and cannot be a glyph -- see the image: block and icon_for().
font:
  - file: "gfonts://Roboto"
    id: font_roboto_s
    size: 8
    extras:
      - &btc_sign_sans
        file: "gfonts://Noto+Sans"
        glyphs: ["\u20BF"]
      - &emoji_glyphs
        file: "gfonts://Noto+Emoji"
        glyphs:
          - "\U0001F642"  # slightly smiling face  (:smile:)
          - "\U0001F641"  # slightly frowning face  (:sad:)
          - "\U0001F622"  # crying face             (:cry:)
          - "\u2764"      # heavy black heart       (:heart:)
          - "\U0001F44D"  # thumbs up sign          (:thumbsup:)
          - "\U0001F44E"  # thumbs down sign        (:thumbsdown:)
          - "\u2600"      # black sun with rays     (:sun:)
          - "\u2601"      # cloud                   (:cloud:)
          - "\u2614"      # umbrella with rain drops(:rain:)
  - file: "gfonts://Roboto"
    id: font_roboto_m
    size: 14
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto"
    id: font_roboto_l
    size: 20
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto+Mono"
    id: font_mono_s
    size: 8
    extras:
      - &btc_sign_mono
        file: "gfonts://Noto+Sans+Mono"
        glyphs: ["\u20BF"]
      - *emoji_glyphs
  - file: "gfonts://Roboto+Mono"
    id: font_mono_m
    size: 14
    extras:
      - *btc_sign_mono
      - *emoji_glyphs
  - file: "gfonts://Roboto+Mono"
    id: font_mono_l
    size: 20
    extras:
      - *btc_sign_mono
      - *emoji_glyphs
  - file: "gfonts://Roboto+Slab"
    id: font_slab_s
    size: 8
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto+Slab"
    id: font_slab_m
    size: 14
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto+Slab"
    id: font_slab_l
    size: 20
    extras:
      - *btc_sign_sans
      - *emoji_glyphs

# Inline icons, drawn as full-color images by the display lambda. Three sizes to
# match the three text sizes (small/medium/large), mirroring the fonts above.
# Source is the public-domain Bitcoin logo (Wikimedia Commons,
# File:Bitcoin.svg); resvg rasterizes it at build time, so there is no
# runtime SVG cost.
#
# To add an icon: drop the .svg/.png in yamls/images/, add three entries here
# (_s/_m/_l), then add a case to icon_for() and a token to ICON_TOKENS below.
image:
  - platform: file
    file: images/bitcoin.svg
    id: icon_btc_s
    type: RGB565
    transparency: alpha_channel
    resize: 8x8
  - platform: file
    file: images/bitcoin.svg
    id: icon_btc_m
    type: RGB565
    transparency: alpha_channel
    resize: 14x14
  - platform: file
    file: images/bitcoin.svg
    id: icon_btc_l
    type: RGB565
    transparency: alpha_channel
    resize: 20x20

# Pin mapping below is for RGB Matrix Adapter Board (E) Rev 2.2 by Seengreat,
# wired to a genuine ESP32-S3-DevKitC-1 module.
#
# Verified compatible by physical inspection on 2026-06-16:
#   - Adapter board silkscreen confirmed: "RGB Matrix Adapter Board (E)
#     Rev 2.2" (Seengreat)
#   - ESP32-S3 module confirmed standard DevKitC-1 pin layout/labeling
#     (module marked S3-N16R8, WiFi+BT)
# Pin mapping source: https://seengreat.com/wiki/186/rgb-matrix-adapter-board-e
# (Rev 2.2 corresponds to the "V2.x" table on that page for the
# ESP32-S3-DevKitC-1 wiring diagram.)
display:
  # matrix_hub75 reads panel layout + dimensions from NVS at boot (see write-nvs-secrets.sh).
  # HUB75 panels cannot self-report; set via:
  #   iotstack flash ... --horizontal-panel-count=2 --vertical-panel-count=1 etc.
  - platform: matrix_hub75
    id: matrix_display
    # ~25 fps so horizontal scroll and flashing animate smoothly.
    update_interval: 40ms
    panel_width: 64
    panel_height: 32
    max_layout_cols: 2       # panels side by side
    default_layout_cols: 1
    max_layout_rows: 2       # panels stacked top-to-bottom
    default_layout_rows: 1
    brightness: ${matrix_brightness_cap}   # fixed; see per-style brightness="0-100%" in the Styles tags
    r1_pin: GPIO18
    g1_pin: GPIO8
    b1_pin: GPIO17
    r2_pin: GPIO16
    g2_pin: GPIO1
    b2_pin: GPIO15
    a_pin: GPIO7
    b_pin: GPIO48
    c_pin: GPIO6
    d_pin: GPIO47
    lat_pin: GPIO21
    oe_pin: GPIO4
    clk_pin: GPIO5
    # e_pin omitted: your panel is 1/16 scan ("16S" on the panel label),
    # so the E row-select line isn't used.
    lambda: |-
      const int W = it.get_width();
      const int H = it.get_height();
      it.fill(Color(0, 0, 0));  // blank frame first (writer does not auto-clear)

      // Font/size come entirely from the "Styles" box now (Style 1's face/size,
      // or a "<sN>" / "<span font=..>" / "<span font-size=..>" tag -- see
      // below). "roboto" / "medium" is the hardcoded fallback when none apply.
      using FontPtr = std::remove_const<decltype(id(font_roboto_m))>::type;
      auto font_for = [&](const std::string &face, const std::string &sz) -> FontPtr {
        if (face == "mono")
          return (sz == "small") ? id(font_mono_s)
               : (sz == "large") ? id(font_mono_l) : id(font_mono_m);
        if (face == "slab")
          return (sz == "small") ? id(font_slab_s)
               : (sz == "large") ? id(font_slab_l) : id(font_slab_m);
        return (sz == "small") ? id(font_roboto_s)
             : (sz == "large") ? id(font_roboto_l) : id(font_roboto_m);
      };
      std::string face = "roboto";
      std::string sz = "medium";

      // --- Inline icons ------------------------------------------------------
      // Text is walked as UTF-8 codepoints. A codepoint in the icon table renders
      // as a full-color image; every other codepoint renders as a font glyph. So
      // an icon sits in the text flow -- "BTC :btc: 100k" draws the roundel inline.
      //
      // ICON_TOKENS maps a typeable ASCII token to that codepoint, so the panel can
      // be driven from HA without entering literal Unicode. Codepoints live in the
      // Private Use Area (U+E000..), which is what it exists for.
      static const struct { const char *tok; const char *cp; } ICON_TOKENS[] = {
        { ":btc:", "\xEE\x80\x80" },   // U+E000 -- Bitcoin roundel (see the image: block)
      };
      const int ICON_PAD = 1;    // px of breathing room each side of an icon

      // Emoji tokens: an ASCII token maps to a real Unicode emoji codepoint (the
      // font extras above pull each one in from Noto Emoji). Unlike ICON_TOKENS,
      // these are ordinary glyphs, not images -- icon_for() never sees them, so
      // they fall straight through to the normal glyph draw path and take the
      // active style's color like any other character.
      static const struct { const char *tok; const char *cp; } EMOJI_TOKENS[] = {
        { ":smile:",      "\xF0\x9F\x99\x82" },  // U+1F642 slightly smiling face
        { ":sad:",        "\xF0\x9F\x99\x81" },  // U+1F641 slightly frowning face
        { ":cry:",        "\xF0\x9F\x98\xA2" },  // U+1F622 crying face
        { ":heart:",      "\xE2\x9D\xA4" },      // U+2764  heavy black heart
        { ":thumbsup:",   "\xF0\x9F\x91\x8D" },  // U+1F44D thumbs up sign
        { ":thumbsdown:", "\xF0\x9F\x91\x8E" },  // U+1F44E thumbs down sign
        { ":sun:",        "\xE2\x98\x80" },      // U+2600  black sun with rays
        { ":cloud:",      "\xE2\x98\x81" },      // U+2601  cloud
        { ":rain:",       "\xE2\x98\x94" },      // U+2614  umbrella with rain drops
      };

      // Image for an icon codepoint at the current text size; nullptr = not an icon.
      auto icon_for = [&](uint32_t cp) -> esphome::image::Image * {
        switch (cp) {
          case 0xE000:
            return (sz == "small") ? id(icon_btc_s)
                 : (sz == "large") ? id(icon_btc_l) : id(icon_btc_m);
          default:
            return nullptr;
        }
      };

      // Decode the codepoint at s[i], advancing i past it. A malformed byte eats one
      // byte and yields U+FFFD, so bad input can never desync the walk or loop.
      auto next_cp = [](const std::string &s, size_t &i) -> uint32_t {
        uint8_t c = (uint8_t) s[i];
        uint32_t cp;
        int extra;
        if (c < 0x80) { cp = c; extra = 0; }
        else if ((c & 0xE0) == 0xC0) { cp = c & 0x1Fu; extra = 1; }
        else if ((c & 0xF0) == 0xE0) { cp = c & 0x0Fu; extra = 2; }
        else if ((c & 0xF8) == 0xF0) { cp = c & 0x07u; extra = 3; }
        else { i++; return 0xFFFD; }
        if (i + (size_t) extra >= s.size()) { i++; return 0xFFFD; }
        for (int k = 1; k <= extra; k++) {
          uint8_t cc = (uint8_t) s[i + (size_t) k];
          if ((cc & 0xC0) != 0x80) { i++; return 0xFFFD; }
          cp = (cp << 6) | (uint32_t) (cc & 0x3Fu);
        }
        i += (size_t) extra + 1;
        return cp;
      };

      // Per-character style, set by inline HTML-like tags (see the tag parser
      // below) and carried alongside the text through wrap/measure/draw so a
      // single "Display Text" string can mix fonts, colors, flash rates and
      // local brightness -- e.g. "Price <s2>{{ states(...) }}</s2>" renders the
      // templated value in Style 2, inline, no separate entity needed.
      // grad_id < 0: color is final as-is. grad_id >= 0: color is a
      // placeholder, overwritten below (see "Gradient resolution") with a
      // color interpolated from grad_runs[grad_id] by this character's
      // pixel position within its contiguous gradient run.
      struct Style { FontPtr font; Color color; float flash_s; float bright; int grad_id = -1; };

      // Text laid out with a Style attached to every byte (1:1 with the bytes in
      // .s, repeated across a codepoint's continuation bytes). Every helper below
      // takes/returns SText instead of std::string so style always travels with
      // the text it colors, through substr/append/word-wrap alike.
      struct SText {
        std::string s;
        std::vector<Style> st;
        void push(char c, const Style &sty) { s.push_back(c); st.push_back(sty); }
        bool empty() const { return s.empty(); }
        void clear() { s.clear(); st.clear(); }
      };

      // Width of t in px, counting icons by their image width, each codepoint
      // measured with its own style's font. Every width below goes through here,
      // so wrap, scroll span and gradient all agree on one number.
      auto measure = [&](const SText &t) -> int {
        int w = 0;
        size_t i = 0;
        while (i < t.s.size()) {
          size_t start = i;
          auto *ic = icon_for(next_cp(t.s, i));
          if (ic != nullptr) { w += ic->get_width() + 2 * ICON_PAD; continue; }
          int bx, by, cw, ch;
          it.get_text_bounds(0, 0, t.s.substr(start, i - start).c_str(), t.st[start].font,
                             TextAlign::TOP_LEFT, &bx, &by, &cw, &ch);
          w += cw;
        }
        return w;
      };

      std::string text = id(display_text).state;
      if (text.empty()) return;

      // ":btc:" -> U+E000, so the rest of the lambda only ever sees codepoints.
      for (const auto &t : ICON_TOKENS) {
        size_t at = 0;
        size_t tlen = strlen(t.tok), clen = strlen(t.cp);
        while ((at = text.find(t.tok, at)) != std::string::npos) {
          text.replace(at, tlen, t.cp);
          at += clen;
        }
      }

      // ":smile:" -> U+1F642, etc, so HA can drive emoji without literal Unicode.
      for (const auto &t : EMOJI_TOKENS) {
        size_t at = 0;
        size_t tlen = strlen(t.tok), clen = strlen(t.cp);
        while ((at = text.find(t.tok, at)) != std::string::npos) {
          text.replace(at, tlen, t.cp);
          at += clen;
        }
      }

      // --- Tag parsing (shared by the "Styles" box and Display Text) ---------
      // A single attr="value" pair inside a tag.
      struct Attr { std::string key, val; };

      // A parsed "<name attr=\"val\" ...>", "<name .../>" or "</name>".
      // Structurally malformed input (unterminated tag, bad attr="value" pair)
      // comes back with valid=false, so the caller falls back to treating the
      // "<" as a literal character -- the same forgiving behavior an
      // unrecognized token had before.
      struct Tag {
        bool valid = false, closing = false, self_closing = false;
        std::string name;
        std::vector<Attr> attrs;
        size_t end = 0;   // index just past the tag's '>'
      };

      // Parses one attr="value" pair starting at s[i] (i at the first char of
      // the key); advances i past the closing quote on success.
      auto parse_attr = [&](const std::string &s, size_t &i, std::string &key, std::string &val) -> bool {
        size_t kstart = i;
        while (i < s.size() && s[i] != '=' && s[i] != ' ' && s[i] != '>' && s[i] != '/') i++;
        if (i == kstart) return false;
        key = s.substr(kstart, i - kstart);
        while (i < s.size() && s[i] == ' ') i++;
        if (i >= s.size() || s[i] != '=') return false;
        i++;
        while (i < s.size() && s[i] == ' ') i++;
        if (i >= s.size() || s[i] != '"') return false;
        i++;
        size_t vstart = i;
        while (i < s.size() && s[i] != '"') i++;
        if (i >= s.size()) return false;
        val = s.substr(vstart, i - vstart);
        i++;
        return true;
      };

      // Parses the tag starting at s[start] (s[start] == '<').
      auto parse_tag = [&](const std::string &s, size_t start) -> Tag {
        Tag t;
        size_t i = start + 1;
        if (i < s.size() && s[i] == '/') { t.closing = true; i++; }
        size_t nstart = i;
        while (i < s.size() && ((s[i] >= 'a' && s[i] <= 'z') || (s[i] >= 'A' && s[i] <= 'Z') ||
                                (s[i] >= '0' && s[i] <= '9') || s[i] == '-')) i++;
        if (i == nstart) return Tag{};
        t.name = s.substr(nstart, i - nstart);
        while (i < s.size() && s[i] == ' ') i++;
        if (t.closing) {
          if (i >= s.size() || s[i] != '>') return Tag{};
          t.valid = true;
          t.end = i + 1;
          return t;
        }
        while (true) {
          if (i < s.size() && s[i] == '/') {
            t.self_closing = true;
            i++;
            while (i < s.size() && s[i] == ' ') i++;
          }
          if (i < s.size() && s[i] == '>') { i++; break; }
          if (i >= s.size()) return Tag{};
          std::string key, val;
          if (!parse_attr(s, i, key, val)) return Tag{};
          t.attrs.push_back(Attr{key, val});
          while (i < s.size() && s[i] == ' ') i++;
        }
        t.valid = true;
        t.end = i;
        return t;
      };

      // "sN" (N >= 1) name check shared by the Styles box and Display Text.
      auto style_num = [&](const std::string &name, int &n) -> bool {
        if (name.size() < 2 || name[0] != 's') return false;
        for (size_t k = 1; k < name.size(); k++)
          if (name[k] < '0' || name[k] > '9') return false;
        n = (int) strtol(name.c_str() + 1, nullptr, 10);
        return n >= 1;
      };

      // Applies one attr="value" pair to a (color, brightness, font, font-size,
      // flash-interval) tuple -- used by the <sN>/<span> attribute overlay in
      // Display Text (a per-use tweak of an already-composed style; the
      // "Styles" box itself no longer uses this attr="value" syntax, see the
      // "Style definitions" section below). Each attribute also accepts a
      // short alias (c/b/f/fs/fi) and color additionally accepts "#RRGGBB" hex.
      auto apply_kv = [&](Color &color, float &bright, std::string &face_, std::string &size_,
                          float &flash_s, const std::string &key, const std::string &val) {
        if (key == "color" || key == "c") {
          if (!val.empty() && val[0] == '#') {
            long hex = strtol(val.c_str() + 1, nullptr, 16);
            color = Color((uint8_t) (hex >> 16), (uint8_t) (hex >> 8), (uint8_t) hex);
          } else {
            char *endp = nullptr;
            long r = strtol(val.c_str(), &endp, 10);
            long g = (endp != nullptr && *endp == ',') ? strtol(endp + 1, &endp, 10) : 255;
            long b = (endp != nullptr && *endp == ',') ? strtol(endp + 1, &endp, 10) : 255;
            color = Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
          }
        } else if (key == "brightness" || key == "b") {
          float pct = strtof(val.c_str(), nullptr);
          if (pct < 0) pct = 0;
          if (pct > 100) pct = 100;
          bright = pct / 100.0f;
        } else if (key == "font" || key == "f") {
          face_ = (val == "r") ? "roboto" : (val == "m") ? "mono" : (val == "s") ? "slab" : val;
        } else if (key == "font-size" || key == "fs") {
          size_ = (val == "s") ? "small" : (val == "m") ? "medium" : (val == "l") ? "large" : val;
        } else if (key == "flash-interval" || key == "fi") {
          flash_s = strtof(val.c_str(), nullptr);
        }
      };

      // --- Style component definitions (Colors / Brightness Levels /
      // Gradients / Flash Intervals text boxes) -------------------------------
      // Each box holds whitespace-separated "name:value" entries (a stray
      // trailing comma on an entry, e.g. pasted from a list, is tolerated and
      // stripped). Shared tokenizer for all four boxes plus the "Styles" box
      // below.
      auto for_each_entry = [&](const std::string &spec, auto cb) {
        size_t i = 0;
        while (i < spec.size()) {
          while (i < spec.size() && (spec[i] == ' ' || spec[i] == ',')) i++;
          size_t start = i;
          while (i < spec.size() && spec[i] != ' ') i++;
          std::string entry = spec.substr(start, i - start);
          while (!entry.empty() && entry.back() == ',') entry.pop_back();
          size_t colon = entry.find(':');
          if (colon == std::string::npos || colon == 0) continue;
          cb(entry.substr(0, colon), entry.substr(colon + 1));
        }
      };

      // "xN" (N >= 1) name check, shared by every definition box and by the
      // "<sN>" tag in Display Text.
      auto named_num = [&](char prefix, const std::string &name, int &n) -> bool {
        if (name.size() < 2 || name[0] != prefix) return false;
        for (size_t k = 1; k < name.size(); k++)
          if (name[k] < '0' || name[k] > '9') return false;
        n = (int) strtol(name.c_str() + 1, nullptr, 10);
        return n >= 1;
      };

      // "r,g,b" or "#RRGGBB" (same formats the old color/c attribute took).
      auto parse_color_value = [&](const std::string &val) -> Color {
        if (!val.empty() && val[0] == '#') {
          long hex = strtol(val.c_str() + 1, nullptr, 16);
          return Color((uint8_t) (hex >> 16), (uint8_t) (hex >> 8), (uint8_t) hex);
        }
        char *endp = nullptr;
        long r = strtol(val.c_str(), &endp, 10);
        long g = (endp != nullptr && *endp == ',') ? strtol(endp + 1, &endp, 10) : 255;
        long b = (endp != nullptr && *endp == ',') ? strtol(endp + 1, &endp, 10) : 255;
        return Color((uint8_t) r, (uint8_t) g, (uint8_t) b);
      };

      // Each component box parses into a flat vector of {n, value} entries
      // (matching the StyleDef/find_style pattern below) rather than a map --
      // these boxes hold at most a handful of entries, so a linear scan is
      // simplest and needs no extra container header. "Last one wins" on a
      // repeated name, same as the "Styles" box.
      struct NamedColor { int n; Color c; };
      struct NamedFloat { int n; float v; };
      struct NamedGradient { int n; std::vector<Color> stops; };
      auto find_color = [](const std::vector<NamedColor> &v, int n) -> const Color * {
        const Color *found = nullptr;
        for (const auto &e : v) if (e.n == n) found = &e.c;
        return found;
      };
      auto find_float = [](const std::vector<NamedFloat> &v, int n) -> const float * {
        const float *found = nullptr;
        for (const auto &e : v) if (e.n == n) found = &e.v;
        return found;
      };
      auto find_gradient = [](const std::vector<NamedGradient> &v, int n) -> const std::vector<Color> * {
        const std::vector<Color> *found = nullptr;
        for (const auto &e : v) if (e.n == n) found = &e.stops;
        return found;
      };

      // "Colors": c1:255,255,255 c2:128,128,128 c3:#000000
      std::vector<NamedColor> colors;
      for_each_entry(id(display_colors).state, [&](const std::string &name, const std::string &val) {
        int n;
        if (named_num('c', name, n)) colors.push_back(NamedColor{n, parse_color_value(val)});
      });

      // "Brightness Levels": b1:50% b2:10 ("%" suffix optional)
      std::vector<NamedFloat> brightnesses;
      for_each_entry(id(display_brightness).state, [&](const std::string &name, const std::string &val) {
        int n;
        if (!named_num('b', name, n)) return;
        float pct = strtof(val.c_str(), nullptr);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        brightnesses.push_back(NamedFloat{n, pct / 100.0f});
      });

      // "Gradients": g1:c1,c2,c3 g2:c1,c3 -- refs resolve against Colors above;
      // an unknown color name is skipped, so a gradient left with fewer than 2
      // resolved stops is dropped entirely (a style referencing it just falls
      // back to its plain color).
      std::vector<NamedGradient> gradients;
      for_each_entry(id(display_gradients).state, [&](const std::string &name, const std::string &val) {
        int n;
        if (!named_num('g', name, n)) return;
        std::vector<Color> stops;
        size_t start = 0;
        while (start <= val.size()) {
          size_t comma = val.find(',', start);
          std::string ref = val.substr(start, comma == std::string::npos ? std::string::npos : comma - start);
          int cn;
          if (named_num('c', ref, cn)) {
            const Color *found = find_color(colors, cn);
            if (found != nullptr) stops.push_back(*found);
          }
          if (comma == std::string::npos) break;
          start = comma + 1;
        }
        if (stops.size() >= 2) gradients.push_back(NamedGradient{n, stops});
      });

      // "Flash Intervals": f1:10 f2:20 -- seconds per blink cycle, same
      // unit/format as the panel-wide "Flash Interval" number ("s" suffix
      // optional).
      std::vector<NamedFloat> flash_defs;
      for_each_entry(id(display_flash).state, [&](const std::string &name, const std::string &val) {
        int n;
        if (named_num('f', name, n)) flash_defs.push_back(NamedFloat{n, strtof(val.c_str(), nullptr)});
      });

      // --- Style definitions (from the "Styles" + "Styles 2" text boxes) -----
      // Syntax: one "sN:token,token,..." entry per style, e.g.
      //   s1:g1,f2,b2,mono s2:c2,b1,roboto
      // Each token is either a reference into one of the four boxes above, or
      // a literal font family/size:
      //   cN                  color            (Colors box)
      //   gN                  gradient         (Gradients box) -- overrides
      //                                        cN when both are given
      //   bN                  brightness       (Brightness Levels box)
      //   fN                  flash interval   (Flash Intervals box)
      //   roboto | mono | slab            font family (default: roboto)
      //   small | medium | large          font size   (default: medium)
      // An unresolved or unrecognized token is ignored, falling back to that
      // attribute's default (color: white, brightness: 100%, flash-interval:
      // the "Flash Interval" number below). Re-defining "sN" later overrides
      // an earlier definition of the same number -- "Styles 2" is treated as
      // a continuation appended after "Styles", so it wins ties.
      struct StyleDef {
        int n; bool set = false;
        Color color{255, 255, 255}; float bright = 1.0f;
        std::string face = "roboto"; std::string size = "medium";
        bool has_flash = false; float flash_s = 0.0f;
        bool has_gradient = false; std::vector<Color> gradient;
      };
      std::vector<StyleDef> styles;
      {
        std::string spec = id(display_styles).state + id(display_styles_2).state;
        for_each_entry(spec, [&](const std::string &name, const std::string &val) {
          int n;
          if (!style_num(name, n)) return;
          StyleDef sd;
          sd.n = n;
          sd.set = true;
          size_t start = 0;
          while (start <= val.size()) {
            size_t comma = val.find(',', start);
            std::string tok = val.substr(start, comma == std::string::npos ? std::string::npos : comma - start);
            int tn;
            if (named_num('c', tok, tn)) {
              const Color *found = find_color(colors, tn);
              if (found != nullptr) sd.color = *found;
            } else if (named_num('g', tok, tn)) {
              const std::vector<Color> *found = find_gradient(gradients, tn);
              if (found != nullptr) { sd.has_gradient = true; sd.gradient = *found; }
            } else if (named_num('b', tok, tn)) {
              const float *found = find_float(brightnesses, tn);
              if (found != nullptr) sd.bright = *found;
            } else if (named_num('f', tok, tn)) {
              const float *found = find_float(flash_defs, tn);
              if (found != nullptr) { sd.has_flash = true; sd.flash_s = *found; }
            } else if (tok == "roboto" || tok == "mono" || tok == "slab") {
              sd.face = tok;
            } else if (tok == "small" || tok == "medium" || tok == "large") {
              sd.size = tok;
            }
            if (comma == std::string::npos) break;
            start = comma + 1;
          }
          styles.push_back(sd);
        });
      }
      // Last definition of a given "sN" wins, so a later entry overrides an
      // earlier one instead of merging with it.
      auto find_style = [&](int n) -> const StyleDef * {
        const StyleDef *found = nullptr;
        for (const auto &sd : styles)
          if (sd.n == n) found = &sd;
        return found;
      };

      // Effective draw color: the style's color scaled by its brightness
      // (0-100%), on top of the panel's fixed hardware brightness ceiling
      // (matrix_brightness_cap, set once at the display's brightness: config,
      // not adjustable at runtime).
      auto eff_color = [&](const Style &sty) -> Color {
        return Color((uint8_t) lroundf(sty.color.r * sty.bright),
                     (uint8_t) lroundf(sty.color.g * sty.bright),
                     (uint8_t) lroundf(sty.color.b * sty.bright));
      };

      // Draw one line: walk it a codepoint at a time, drawing icons as images and
      // everything else as glyphs, each using its own style's font/color/flash.
      auto draw_line = [&](int x0, int y, const SText &t, bool center_v) {
        TextAlign al = center_v ? TextAlign::CENTER_LEFT : TextAlign::TOP_LEFT;
        if (measure(t) <= 0) return;
        int cx = 0;
        size_t i = 0;
        while (i < t.s.size()) {
          size_t start = i;
          const Style &sty = t.st[start];
          bool vis = true;
          if (sty.flash_s > 0.01f) {
            float phase = fmodf(millis() / 1000.0f, sty.flash_s);
            vis = phase < sty.flash_s * 0.5f;    // "off" half -> skip drawing
          }
          auto *ic = icon_for(next_cp(t.s, i));
          if (ic != nullptr) {
            int iw = ic->get_width() + 2 * ICON_PAD;
            if (vis) {
              // A color image ignores the color argument; a 1-bit icon would be
              // tinted by the style color here, exactly like text.
              it.image(x0 + cx + ICON_PAD,
                       center_v ? (y - ic->get_height() / 2) : y,
                       ic, eff_color(sty), Color::BLACK);
            }
            cx += iw;
            continue;
          }
          std::string one = t.s.substr(start, i - start);   // one whole codepoint
          int cbx, cby, cw, chh;
          it.get_text_bounds(0, 0, one.c_str(), sty.font, al, &cbx, &cby, &cw, &chh);
          if (vis) it.print(x0 + cx, y, sty.font, eff_color(sty), al, one.c_str());
          cx += cw;
        }
      };

      // --- Inline style tags ---------------------------------------------------
      // A style-carrying frame: Style plus the font/size strings it was built
      // from (font_for() needs both strings whenever either one changes).
      struct Frame { Style style; std::string face_; std::string size_; };

      // Each gradient a style resolves to gets its own entry here, indexed by
      // Style::grad_id -- a fresh entry per "<sN>" occurrence (not shared
      // across repeated uses of the same style number), so each run
      // interpolates independently. See "Gradient resolution" below.
      std::vector<std::vector<Color>> grad_runs;

      // Resolves "<sN>" to a Frame from scratch: a *named* style is a fixed
      // look, independent of wherever it's used, so this starts from the
      // global default (white/100%/roboto/medium/Flash Interval) and layers
      // sN's own definition on top -- never the currently active style.
      auto resolve_named = [&](int n) -> Frame {
        Frame f{Style{font_for("roboto", "medium"), Color(255, 255, 255), id(flash_interval).state, 1.0f, -1},
                "roboto", "medium"};
        if (const StyleDef *def = find_style(n)) {
          f.face_ = def->face; f.size_ = def->size;
          f.style.bright = def->bright;
          f.style.flash_s = def->has_flash ? def->flash_s : id(flash_interval).state;
          f.style.font = font_for(f.face_, f.size_);
          if (def->has_gradient) {
            grad_runs.push_back(def->gradient);
            f.style.grad_id = (int) grad_runs.size() - 1;
            f.style.color = def->gradient.front();   // placeholder, overwritten below
          } else {
            f.style.color = def->color;
          }
        }
        return f;
      };

      // Overlays a tag's attrs (if any) onto a base frame -- used both for
      // "<sN attr=\"..\">" (tweak style N just for this run) and "<span attr=\"..\">"
      // (tweak whatever style is currently active). Attrs not present on the
      // tag leave the base's value untouched. An explicit color="..."/c="..."
      // overrides a gradient the base frame may have carried.
      auto overlay = [&](Frame f, const std::vector<Attr> &attrs) -> Frame {
        for (const auto &kv : attrs) {
          if (kv.key == "color" || kv.key == "c") f.style.grad_id = -1;
          apply_kv(f.style.color, f.style.bright, f.face_, f.size_, f.style.flash_s, kv.key, kv.val);
        }
        f.style.font = font_for(f.face_, f.size_);
        return f;
      };

      // "<br/>" / "<br>" forces a line break (typed since the HA "Display Text"
      // box is single-line and can't hold a literal newline); it is folded to
      // '\n' here so it reuses the existing word-wrap line-break handling
      // untouched.
      //
      // "<sN>...</sN>" applies style N (as defined in "Styles" above, optionally
      // tweaked by attrs given right on this tag) to the enclosed text, then
      // reverts on the matching close. "<sN ... />" (self-closing, no matching
      // close) applies it from this point onward instead, until the next tag
      // changes it or the text ends -- handy for a quick switch with nothing to
      // remember to switch back. "<span attr=\"..\">...</span>" / "<span .../>"
      // work the same way but tweak the *currently active* style instead of
      // switching to a named one, e.g. "<span brightness=\"50%\">dim</span>" to
      // dim one word without defining a whole new style.
      //
      // A closing tag "</...>" always reverts to whatever was active just
      // before its matching open -- the tag name doesn't have to match (so
      // "</span>" and "</s2>" are interchangeable), and one with no
      // corresponding open is ignored.
      //
      // Text before the first tag uses Style 1 if defined, else white/roboto.
      // An unrecognized "<...>" (a malformed tag, or a name that isn't "br",
      // "span" or "sN") is left as literal text -- so is a plain "<"/">" in
      // ordinary text, e.g. "5 < 10", as long as what follows doesn't happen to
      // look like one of these tag names.
      std::vector<Frame> stack;
      stack.push_back(resolve_named(1));
      face = stack.back().face_;
      sz = stack.back().size_;
      SText body;
      {
        size_t i = 0;
        while (i < text.size()) {
          if (text[i] == '<') {
            Tag t = parse_tag(text, i);
            int n = 0;
            bool is_style = t.valid && !t.closing && style_num(t.name, n);
            bool recognized = t.valid && (t.closing || t.name == "br" || t.name == "span" || is_style);
            if (recognized) {
              if (t.closing) {
                if (stack.size() > 1) stack.pop_back();
              } else if (t.name == "br") {
                body.push('\n', stack.back().style);
              } else {
                Frame f = is_style ? overlay(resolve_named(n), t.attrs) : overlay(stack.back(), t.attrs);
                if (t.self_closing) stack.back() = f;
                else stack.push_back(f);
              }
              face = stack.back().face_;
              sz = stack.back().size_;
              i = t.end;
              continue;
            }
          }
          body.push(text[i], stack.back().style);
          i++;
        }
      }

      // --- Gradient resolution -------------------------------------------------
      // Bakes a real color into every gradient-tagged character now, so
      // draw_line/measure/word-wrap below never need to know about gradients.
      // For each contiguous run of characters sharing a grad_id, the color is
      // interpolated across grad_runs[grad_id] by that character's pixel
      // position within the run (0 at the run's first pixel, 1 at its last) --
      // brightness is applied on top of this as usual, at draw time, by
      // eff_color().
      if (!grad_runs.empty()) {
        auto lerp_color = [](const Color &a, const Color &b, float t) -> Color {
          return Color((uint8_t) lroundf(a.r + (b.r - a.r) * t),
                       (uint8_t) lroundf(a.g + (b.g - a.g) * t),
                       (uint8_t) lroundf(a.b + (b.b - a.b) * t));
        };
        auto gradient_color = [&](const std::vector<Color> &cs, float t) -> Color {
          if (cs.size() == 1) return cs[0];
          float scaled = t * (float) (cs.size() - 1);
          if (scaled < 0) scaled = 0;
          size_t idx = (size_t) scaled;
          if (idx >= cs.size() - 1) idx = cs.size() - 2;
          return lerp_color(cs[idx], cs[idx + 1], scaled - (float) idx);
        };

        size_t gi = 0;
        while (gi < body.s.size()) {
          int gid = body.st[gi].grad_id;
          if (gid < 0) { gi++; continue; }
          size_t run_start = gi;
          while (gi < body.s.size() && body.st[gi].grad_id == gid) gi++;
          size_t run_end = gi;
          const auto &gcolors = grad_runs[(size_t) gid];

          std::vector<size_t> cp_pos;
          std::vector<int> cp_w;
          int total_w = 0;
          size_t j = run_start;
          while (j < run_end) {
            size_t cstart = j;
            auto *ic = icon_for(next_cp(body.s, j));
            int w;
            if (ic != nullptr) {
              w = ic->get_width();
            } else {
              int bx, by, cw, ch;
              it.get_text_bounds(0, 0, body.s.substr(cstart, j - cstart).c_str(), body.st[cstart].font,
                                 TextAlign::TOP_LEFT, &bx, &by, &cw, &ch);
              w = cw;
            }
            cp_pos.push_back(cstart);
            cp_w.push_back(w);
            total_w += w;
          }
          int acc = 0;
          for (size_t k = 0; k < cp_pos.size(); k++) {
            float t = (total_w > 0) ? ((float) acc + cp_w[k] * 0.5f) / (float) total_w : 0.0f;
            Color c = gradient_color(gcolors, t);
            size_t cp_end = (k + 1 < cp_pos.size()) ? cp_pos[k + 1] : run_end;
            for (size_t b = cp_pos[k]; b < cp_end; b++) body.st[b].color = c;
            acc += cp_w[k];
          }
        }
      }

      // Line height: tallest glyph/icon used anywhere in the message, applied
      // uniformly to every wrapped line (a per-line height would need a second
      // wrap pass; this is simpler and fine for the short strings this panel shows).
      int th = 1;
      {
        size_t i = 0;
        while (i < body.s.size()) {
          size_t start = i;
          auto *ic = icon_for(next_cp(body.s, i));
          if (ic != nullptr) { if (ic->get_height() > th) th = ic->get_height(); continue; }
          int bx, by, cw, ch;
          it.get_text_bounds(0, 0, body.s.substr(start, i - start).c_str(), body.st[start].font,
                             TextAlign::TOP_LEFT, &bx, &by, &cw, &ch);
          if (ch > th) th = ch;
        }
      }
      int tw = measure(body);

      if (id(word_wrap).state) {
        // Greedy word wrap into lines no wider than the panel (honors '\n').
        std::vector<SText> lines;
        SText line, word;
        size_t i = 0;
        while (true) {
          bool end = (i >= body.s.size());
          char c = end ? ' ' : body.s[i];
          Style sty = end ? stack.back().style : body.st[i];
          if (c == ' ' || c == '\n') {
            if (!word.empty()) {
              SText cand;
              if (line.empty()) {
                cand = word;
              } else {
                cand = line;
                cand.push(' ', word.st.front());
                cand.s += word.s;
                cand.st.insert(cand.st.end(), word.st.begin(), word.st.end());
              }
              if (measure(cand) > W && !line.empty()) { lines.push_back(line); line = word; }
              else line = cand;
              word.clear();
            }
            if (c == '\n') { lines.push_back(line); line.clear(); }
          } else {
            word.push(c, sty);
          }
          if (end) break;
          i++;
        }
        if (!line.empty()) lines.push_back(line);

        int total = (int) lines.size() * th;
        float vspeed = id(vscroll_speed).state;
        if (total > H && vspeed > 0.0f) {
          // Too tall -> scroll vertically, drawing a second copy for a seamless loop.
          int span = total + th;               // blank gap (one line) before repeat
          int voff = (int) fmodf(millis() / 1000.0f * vspeed, (float) span);
          for (int copy = 0; copy < 2; copy++) {
            int base = -voff + copy * span;
            for (size_t k = 0; k < lines.size(); k++)
              draw_line(0, base + (int) k * th, lines[k], false);
          }
        } else {
          // Fits (or vscroll off): vertically centered, top-aligned lines.
          int y0 = (total < H) ? (H - total) / 2 : 0;
          for (size_t k = 0; k < lines.size(); k++)
            draw_line(0, y0 + (int) k * th, lines[k], false);
        }
      } else if (tw <= W) {
        // Fits on one line: vertically centered, left-aligned.
        draw_line(0, H / 2, body, true);
      } else {
        // Wider than the panel: scroll horizontally at hscroll_speed px/s.
        float speed = id(hscroll_speed).state;
        int span = tw + W;                     // blank gap (panel width) before repeat
        int off = 0;
        if (speed > 0.0f)
          off = (int) fmodf(millis() / 1000.0f * speed, (float) span);
        draw_line(-off, H / 2, body, true);
        draw_line(-off + span, H / 2, body, true);  // second copy -> seamless loop
      }

# Home Assistant controls (entity ids are number./text./switch./light.
# matrix_display_<mac>_<slug>):
#   Colors                (text)   -- defines named colors, referenced from "Gradients" and
#                                     "Styles" below as cN. Whitespace-separated "cN:value"
#                                     entries, any order:
#                                       c1:255,255,255 c2:128,128,128 c3:#000000
#                                     Value is "r,g,b" (decimal 0-255) or "#RRGGBB" hex. A later
#                                     "cN" overrides an earlier definition of the same number.
#                                     Use the "Color Picker" light below to find RGB values: turn
#                                     it on, pick a color on the wheel, then read off the R/G/B
#                                     numbers HA shows and drop them into cN:r,g,b here. The
#                                     picker itself does not affect the display.
#   Brightness Levels     (text)   -- defines named brightness levels, referenced from "Styles"
#                                     below as bN. Whitespace-separated "bN:value" entries:
#                                       b1:50% b2:10%
#                                     Value is 0-100, "%" suffix optional. A later "bN" overrides
#                                     an earlier definition of the same number.
#   Gradients              (text)  -- defines named gradients, referenced from "Styles" below as
#                                     gN. Whitespace-separated "gN:cA,cB,.." entries, each a list
#                                     of 2 or more color refs from "Colors" above:
#                                       g1:c1,c2,c3 g2:c1,c3
#                                     A style using a gradient blends smoothly from the first
#                                     listed color to the last across the pixel width of wherever
#                                     that style is applied in Display Text (a <sN>...</sN> span,
#                                     or from a self-closing <sN/> to the next tag/end of text). A
#                                     color ref that doesn't resolve is skipped; a gradient left
#                                     with fewer than 2 resolved stops is dropped, and a style
#                                     referencing it falls back to its plain color (or white).
#   Flash Intervals        (text)  -- defines named flash intervals, referenced from "Styles"
#                                     below as fN. Whitespace-separated "fN:value" entries, each a
#                                     blink period in seconds:
#                                       f1:10 f2:20
#                                     Same unit as the panel-wide "Flash Interval" number below,
#                                     which a style with no fN of its own falls back to.
#   Styles                (text)   -- composes named styles from the four boxes above, referenced
#                                     from Display Text via <s1>..<sN>. Whitespace-separated
#                                     "sN:token,token,.." entries, any order, tokens in any order:
#                                       s1:g1,f2,b2,mono s2:c2,b1,roboto
#                                     (Style 1: gradient g1, flash interval f2, brightness b2,
#                                     mono font. Style 2: color c2, brightness b1, roboto font.)
#                                     Recognized tokens:
#                                       cN                    color, from "Colors" (default: white)
#                                       gN                    gradient, from "Gradients" -- overrides
#                                                              cN when both are given on the same style
#                                       bN                    brightness, from "Brightness Levels"
#                                                              (default: 100%)
#                                       fN                    flash interval, from "Flash Intervals"
#                                                              (default: the panel-wide "Flash
#                                                              Interval" number below)
#                                       roboto | mono | slab           font family (default: roboto)
#                                       small | medium | large         font size (default: medium)
#                                     An unrecognized or unresolved token (e.g. a cN/gN/bN/fN name
#                                     not defined in its box) is ignored, falling back to that
#                                     attribute's default. A later "sN" overrides an earlier
#                                     definition of the same number.
#   Styles 2              (text)   -- overflow for "Styles" once it fills its 255-char cap (both
#                                     ESPHome's text component and HA's text entity hard-cap length
#                                     at 255, a uint8_t limit -- a single box cannot go higher).
#                                     Its content is appended after "Styles" before parsing: same
#                                     "sN:token,.." syntax, same sN numbers, and a later "sN" here
#                                     overrides an earlier one of the same number in "Styles".
#                                     Leave empty if "Styles" alone is enough. (The "Colors",
#                                     "Brightness Levels", "Gradients" and "Flash Intervals" boxes
#                                     have no overflow box of their own -- keep within 255 chars.)
#   Display Text          (text)   -- the string to show. Everything below is HTML-like
#                                     tags mixed with plain text, ASCII only:
#                                       :btc:                    Bitcoin roundel (full-color image)
#                                       :smile: :sad: :cry: :heart: :thumbsup:
#                                       :thumbsdown: :sun: :cloud: :rain:
#                                                                Unicode emoji, rendered as text glyphs
#                                                                (these two stay ":colon:" tokens --
#                                                                they're glyph substitutions, not styling)
#                                       <br/> or <br>            forced line break (a literal newline
#                                                                in the string works too, but is not
#                                                                typeable in the HA box)
#                                       <sN>text</sN>            apply style N (as defined in "Styles"
#                                                                above) to the enclosed text, then
#                                                                revert to whatever was active before
#                                       <sN attr="val" ...>      same, with one or more of sN's own
#                                       text</sN>                attributes overridden just for this run
#                                       <sN ... />               self-closing: apply style N from here
#                                                                on, with no closing tag needed (until
#                                                                the next tag changes it or text ends)
#                                       <span attr="val" ...>    tweak the *currently active* style
#                                       text</span>              (not a named one) for the enclosed
#                                                                text, e.g. <span brightness="50%">
#                                       <span attr="val" .../>   same, but sticks from here on instead
#                                                                of reverting on a closing tag
#                                     attr="val" pairs on <sN> and <span> here are a separate,
#                                     one-off tweak syntax (not the "Styles" box's cN/gN/bN/fN
#                                     token composition above) with their own short aliases and
#                                     hex colors:
#                                       color="r,g,b" or "#RRGGBB" / c=..   (e.g. <span c="#2621ff" />)
#                                       brightness="0-100" / b=..           "%" suffix optional
#                                       font="roboto|mono|slab" / f=..      or short "r|m|s"
#                                       font-size="small|medium|large" / fs=..  or short "s|m|l"
#                                       flash-interval="Ns" / fi=..         "s" suffix optional
#                                     (e.g. <span b="50" /> is the same as <span brightness="50%" />).
#                                     An explicit color/c here overrides a gradient the target
#                                     style may carry; there is no way to set a gradient from here,
#                                     only from the "Styles" box.
#                                     A closing "</...>" always reverts to whatever was active just
#                                     before its matching open; the tag name doesn't have to match
#                                     (so </span> and </s2> are interchangeable), and one with no
#                                     corresponding open is ignored. Text before the first tag uses
#                                     Style 1 if defined, else white/roboto/medium.
#                                     An unrecognized "<...>" (a malformed tag, or a name that isn't
#                                     "br", "span" or "sN") is left as literal text -- so is a plain
#                                     "<"/">" in ordinary text (e.g. "5 < 10"), as long as what
#                                     follows doesn't happen to look like one of these tag names.
#   Color Picker           (light) -- reference only: does not drive the display. Pick a color
#                                     on the wheel to read off its RGB values for use in the
#                                     "Colors" box (see above).
#   Word Wrap             (switch) -- on: wrap to lines; off: horizontal scroll if wide
#   Flash Interval        (number) -- seconds per blink cycle; 0 = steady. Fallback for any
#                                     style with no flash-interval attribute of its own.
#   Horizontal Scroll Speed (number) -- px/s when a line is wider than the panel
#   Vertical Scroll Speed   (number) -- px/s when wrapped text is taller than the
#                                       panel (Word Wrap must be on)
# Examples:
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_colors}
#   data: {value: 'c1:255,20,7 c2:38,31,255'}
#
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_brightness_levels}
#   data: {value: 'b1:50% b2:80%'}
#
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_styles}
#   data: {value: 's1:c1,b1,roboto s2:c2,b2,mono,large'}
#
#   # gradient style: text fades from c1 to c2 to c3 across its own width
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_gradients}
#   data: {value: 'g1:c1,c2,c3'}
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_styles}
#   data: {value: 's1:g1,roboto'}
#
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "{{ states('sensor.front_door') }}"}
#
#   # inline icon: text, roundel, text -- the icon sits in the text flow and
#   # scales with the active style's size
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "BTC :btc: {{ states('sensor.btc_price') }}"}
#
#   # emoji token -- renders as a text glyph, in the active style's color
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "Door open :sad:"}
#
#   # mixed styling: "Price" in style 1 (default), the value in style 2 and
#   # mono, a forced break, then a small flashing warning back in style 1
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: 'Price <s2>{{ states("sensor.btc_price") }}</s2><br/><span font-size="small" flash-interval="0.5">LOW BATTERY</span>'}
text:
  # Defined before "Styles"/"Display Text" so they list first in the HA
  # entities card, in the order a user would fill them in -- see the
  # "Colors" / "Brightness Levels" / "Gradients" / "Flash Intervals" / "Styles"
  # syntax documented above (Home Assistant controls comment).
  - platform: template
    name: "Colors"
    id: display_colors
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: 'c1:255,136,0 c2:0,190,255'
    on_value:
      - component.update: matrix_display
  - platform: template
    name: "Brightness Levels"
    id: display_brightness
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: ""
    on_value:
      - component.update: matrix_display
  - platform: template
    name: "Gradients"
    id: display_gradients
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: ""
    on_value:
      - component.update: matrix_display
  - platform: template
    name: "Flash Intervals"
    id: display_flash
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: ""
    on_value:
      - component.update: matrix_display
  - platform: template
    name: "Styles"
    id: display_styles
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: 's1:c1,roboto s2:c2,mono'
    on_value:
      - component.update: matrix_display
  # Overflow box for style definitions once "Styles" fills up its 255-char cap
  # (both ESPHome's text component and HA's text entity hard-cap at 255, a
  # uint8_t limit, so a single box cannot go higher). Its content is appended
  # after "Styles" before parsing, so treat it as a continuation, not a
  # separate namespace -- sN numbers and override order span both boxes.
  - platform: template
    name: "Styles 2"
    id: display_styles_2
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: ""
    on_value:
      - component.update: matrix_display
  - platform: template
    name: "Display Text"
    id: display_text
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 255
    initial_value: "iotstack - ${friendly_name}"
    on_value:
      # Redraw immediately so text changes are not delayed to the next update tick.
      - component.update: matrix_display

number:
  - platform: template
    name: "Flash Interval"
    id: flash_interval
    icon: "mdi:flash"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: "s"
    mode: box  # seconds per blink cycle; 0 = steady (no flashing)
  - platform: template
    name: "Horizontal Scroll Speed"
    id: hscroll_speed
    icon: "mdi:arrow-right-thin"
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "px/s"
    mode: box  # scroll rate when a single line is wider than the panel; 0 = static
  - platform: template
    name: "Vertical Scroll Speed"
    id: vscroll_speed
    icon: "mdi:arrow-down-thin"
    optimistic: true
    restore_value: true
    initial_value: 8
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "px/s"
    # Only applies with Word Wrap on: scrolls when wrapped text is taller than the
    # panel. 0 = static (tall text is clipped).
    mode: box

# Reference-only color-wheel light: text color now comes from the "Styles" text
# box (see the Home Assistant controls comment above), not from a light entity,
# so this is the one picker kept around purely so the user can dial in an RGB
# value on the wheel and read it off for a style's color="r,g,b" attribute. It is
# never read by the display lambda and drives no pin (the outputs are no-op
# sinks), so turning it on/off or changing its color has no effect on the panel.
output:
  - platform: template
    type: float
    id: color_ref_r
    write_action: []
  - platform: template
    type: float
    id: color_ref_g
    write_action: []
  - platform: template
    type: float
    id: color_ref_b
    write_action: []

light:
  - platform: rgb
    name: "Color Picker"
    id: color_ref
    icon: "mdi:eyedropper-variant"
    red: color_ref_r
    green: color_ref_g
    blue: color_ref_b
    default_transition_length: 0s
    gamma_correct: 0

switch:
  - platform: template
    name: "Word Wrap"
    id: word_wrap
    icon: "mdi:wrap"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - component.update: matrix_display
    turn_off_action:
      - component.update: matrix_display

text_sensor:
  # object_id "panel_count" is the horizontal count and is also read by the CLI
  # (esphome_text_sensors.py); keep the name slugging to panel_count. "Panel Rows"
  # -> panel_rows is the vertical count. Friendly names below are cosmetic only --
  # do not change the ids without updating the CLI reader.
  - platform: template
    name: "Horizontal Panel Count"
    id: panel_count
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_layout_cols());
  - platform: template
    name: "Vertical Panel Count"
    id: panel_rows
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_layout_rows());
  - platform: template
    name: "Matrix Panel Width"
    id: matrix_panel_width
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_panel_width());
  - platform: template
    name: "Matrix Panel Height"
    id: matrix_panel_height
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_panel_height());
  - platform: template
    name: "Matrix Display Total Size"
    id: matrix_display_size
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_display_width()) + "x" +
             std::to_string(id(matrix_display).get_display_height());