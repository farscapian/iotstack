  - platform: template
    type: float
    id: tcb3_g
    write_action: []
  - platform: template
    type: float
    id: tcb3_b
    write_action: []

light:
  - platform: rgb
    name: "Text Color 1"
    id: text_color_1
    red: tc1_r
    green: tc1_g
    blue: tc1_b
    restore_mode: RESTORE_DEFAULT_ON   # default gradient stop 1: orange
    default_transition_length: 0s      # color changes apply instantly
    gamma_correct: 0                    # linear -> lambda math stays predictable
  - platform: rgb
    name: "Text Color 2"
    id: text_color_2
    red: tc2_r
    green: tc2_g
    blue: tc2_b
    restore_mode: RESTORE_DEFAULT_ON   # default gradient stop 2: red
    default_transition_length: 0s
    gamma_correct: 0
  - platform: rgb
    name: "Text Color 3"
    id: text_color_3
    red: tc3_r
    green: tc3_g
    blue: tc3_b
    restore_mode: RESTORE_DEFAULT_ON   # default gradient stop 3: purple
    default_transition_length: 0s
    gamma_correct: 0
  - platform: rgb
    name: "Text Color B1"
    id: text_color_b1
    red: tcb1_r
    green: tcb1_g
    blue: tcb1_b
    restore_mode: RESTORE_DEFAULT_ON   # default gradient B stop 1: cyan
    default_transition_length: 0s
    gamma_correct: 0
  - platform: rgb
    name: "Text Color B2"
    id: text_color_b2
    red: tcb2_r
    green: tcb2_g
    blue: tcb2_b
