    type: float
    id: tc1_b
    write_action: []
  - platform: template
    type: float
    id: tc2_r
    write_action: []
  - platform: template
    type: float
    id: tc2_g
    write_action: []
  - platform: template
    type: float
    id: tc2_b
    write_action: []
  - platform: template
    type: float
    id: tc3_r
    write_action: []
  - platform: template
    type: float
    id: tc3_g
    write_action: []
  - platform: template
    type: float
    id: tc3_b
    write_action: []
  - platform: template
    type: float
    id: tcb1_r
    write_action: []
  - platform: template
    type: float
    id: tcb1_g
    write_action: []
  - platform: template
    type: float
    id: tcb1_b
    write_action: []
  - platform: template
    type: float
    id: tcb2_r
    write_action: []
  - platform: template
    type: float
    id: tcb2_g
    write_action: []
  - platform: template
    type: float
    id: tcb2_b
