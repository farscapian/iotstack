substitutions:
  device_role: "matrixdisplay"
  friendly_name: "Matrix Display"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC BOOT button
  heartbeat_interval: "10s"   # bootstrap-only aliveness beacon (see interval: below)
  # Brightness: HA sends a 0-100% level via the "Brightness" number; the device
  # maps it linearly to pixel brightness. HA owns any adaptive/dimming curve --
  # compute the percentage from its own sensors + user preference, then push it.
  matrix_brightness_cap: "170"          # Pixel brightness (0-255) at 100% -- hardware safety ceiling
  matrix_brightness_default_pct: "50"   # Startup brightness percentage (Brightness number initial_value)
  matrix_brightness_boot: "85"          # Display brightness at power-on, before on_boot applies the %
  project_version: "0.0.0"

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager, matrix_hub75]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml
  esphome_base: !include common/esphome_base.yaml
  sntp_time: !include common/sntp_time.yaml

esphome:
  name: matrixdisplay
  on_boot:
    - priority: 600
      then:
        # Apply the restored brightness immediately at power-on (no fade).
        - lambda: |-
            float p = id(brightness_pct).state;
            if (p < 0.0f) p = 0.0f;
            if (p > 100.0f) p = 100.0f;
            const float cap = ${matrix_brightness_cap};
            float b = p / 100.0f * cap;
            id(bright_current) = b;
            id(bright_target) = b;
            id(bright_start) = b;
            uint8_t bi = (uint8_t) lroundf(b);
            id(matrix_display).set_brightness(bi);
            id(pixel_brightness).publish_state(bi);
        # One-time default gradient colors: gradient A = orange / red / purple,
        # gradient B (selected inline via the ":gb:" token) = cyan / blue / green,
        # so ":gb:" looks right out of the box. Runs once ever -- after this, each
        # light's own restored/HA-set color takes over.
        - if:
            condition:
              lambda: 'return !id(text_colors_initialized);'
            then:
              - light.turn_on:
                  id: text_color_1
                  red: 100%
                  green: 65%
                  blue: 0%
              - light.turn_on:
                  id: text_color_2
                  red: 100%
                  green: 0%
                  blue: 0%
              - light.turn_on:
                  id: text_color_3
                  red: 50%
                  green: 0%
                  blue: 50%
              - light.turn_on:
                  id: text_color_b1
                  red: 0%
                  green: 100%
                  blue: 100%
              - light.turn_on:
                  id: text_color_b2
                  red: 0%
                  green: 40%
                  blue: 100%
              - light.turn_on:
                  id: text_color_b3
                  red: 0%
                  green: 100%
                  blue: 30%
              - globals.set:
                  id: text_colors_initialized
                  value: 'true'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 16MB


psram:
  mode: octal
 

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

logger:
  hardware_uart: USB_SERIAL_JTAG

# Font face x size, chosen at runtime via the "Font" and "Text Size" selects.
# 3 families (Roboto sans / Roboto Mono / Roboto Slab) x 3 sizes (8/14/20).
#
# extras: pulls U+20BF BITCOIN SIGN, plus a set of Unicode emoji, into every font.
# No Roboto family ships those codepoints (FT_Get_Char_Index returns 0), so they
# are sourced from Noto, which does. Naming them under glyphs: makes a missing
# glyph a hard build error, so a bad font swap fails loudly instead of silently
# rendering nothing. "\uXXXX"/"\UXXXXXXXX" are YAML escapes, so this file stays
# ASCII (project rule).
#
# Emoji are plain monochrome glyphs from Noto Emoji (Google Fonts' outline-only
# emoji family, not the color/bitmap "Noto Color Emoji") -- they follow the Text
# Color gradient exactly like any other glyph, just at low resolution on the
# panel. This is different from the full-color Bitcoin roundel below, which is a
# two-tone image and cannot be a glyph -- see the image: block and icon_for().
font:
  - file: "gfonts://Roboto"
    id: font_roboto_s
    size: 8
    extras:
      - &btc_sign_sans
        file: "gfonts://Noto+Sans"
        glyphs: ["\u20BF"]
      - &emoji_glyphs
        file: "gfonts://Noto+Emoji"
        glyphs:
          - "\U0001F642"  # slightly smiling face  (:smile:)
          - "\U0001F641"  # slightly frowning face  (:sad:)
          - "\U0001F622"  # crying face             (:cry:)
          - "\u2764"      # heavy black heart       (:heart:)
          - "\U0001F44D"  # thumbs up sign          (:thumbsup:)
          - "\U0001F44E"  # thumbs down sign        (:thumbsdown:)
          - "\u2600"      # black sun with rays     (:sun:)
          - "\u2601"      # cloud                   (:cloud:)
          - "\u2614"      # umbrella with rain drops(:rain:)
  - file: "gfonts://Roboto"
    id: font_roboto_m
    size: 14
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto"
    id: font_roboto_l
    size: 20
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto+Mono"
    id: font_mono_s
    size: 8
    extras:
      - &btc_sign_mono
        file: "gfonts://Noto+Sans+Mono"
        glyphs: ["\u20BF"]
      - *emoji_glyphs
  - file: "gfonts://Roboto+Mono"
    id: font_mono_m
    size: 14
    extras:
      - *btc_sign_mono
      - *emoji_glyphs
  - file: "gfonts://Roboto+Mono"
    id: font_mono_l
    size: 20
    extras:
      - *btc_sign_mono
      - *emoji_glyphs
  - file: "gfonts://Roboto+Slab"
    id: font_slab_s
    size: 8
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto+Slab"
    id: font_slab_m
    size: 14
    extras:
      - *btc_sign_sans
      - *emoji_glyphs
  - file: "gfonts://Roboto+Slab"
    id: font_slab_l
    size: 20
    extras:
      - *btc_sign_sans
      - *emoji_glyphs

# Inline icons, drawn as full-color images by the display lambda. Three sizes to
# match the three "Text Size" steps, mirroring the fonts above. Source is the
# public-domain Bitcoin logo (Wikimedia Commons, File:Bitcoin.svg); resvg
# rasterizes it at build time, so there is no runtime SVG cost.
#
# To add an icon: drop the .svg/.png in yamls/images/, add three entries here
# (_s/_m/_l), then add a case to icon_for() and a token to ICON_TOKENS below.
image:
  - platform: file
    file: images/bitcoin.svg
    id: icon_btc_s
    type: RGB565
    transparency: alpha_channel
    resize: 8x8
  - platform: file
    file: images/bitcoin.svg
    id: icon_btc_m
    type: RGB565
    transparency: alpha_channel
    resize: 14x14
  - platform: file
    file: images/bitcoin.svg
    id: icon_btc_l
    type: RGB565
    transparency: alpha_channel
    resize: 20x20

# Pin mapping below is for RGB Matrix Adapter Board (E) Rev 2.2 by Seengreat,
# wired to a genuine ESP32-S3-DevKitC-1 module.
#
# Verified compatible by physical inspection on 2026-06-16:
#   - Adapter board silkscreen confirmed: "RGB Matrix Adapter Board (E)
#     Rev 2.2" (Seengreat)
#   - ESP32-S3 module confirmed standard DevKitC-1 pin layout/labeling
#     (module marked S3-N16R8, WiFi+BT)
# Pin mapping source: https://seengreat.com/wiki/186/rgb-matrix-adapter-board-e
# (Rev 2.2 corresponds to the "V2.x" table on that page for the
# ESP32-S3-DevKitC-1 wiring diagram.)
display:
  # matrix_hub75 reads panel layout + dimensions from NVS at boot (see write-nvs-secrets.sh).
  # HUB75 panels cannot self-report; set via:
  #   iotstack flash ... --horizontal-panel-count=2 --vertical-panel-count=1 etc.
  - platform: matrix_hub75
    id: matrix_display
    # ~25 fps so horizontal scroll and flashing animate smoothly.
    update_interval: 40ms
    panel_width: 64
    panel_height: 32
    max_layout_cols: 2       # panels side by side
    default_layout_cols: 1
    max_layout_rows: 2       # panels stacked top-to-bottom
    default_layout_rows: 1
    brightness: ${matrix_brightness_boot}
    r1_pin: GPIO18
    g1_pin: GPIO8
    b1_pin: GPIO17
    r2_pin: GPIO16
    g2_pin: GPIO1
    b2_pin: GPIO15
    a_pin: GPIO7
    b_pin: GPIO48
    c_pin: GPIO6
    d_pin: GPIO47
    lat_pin: GPIO21
    oe_pin: GPIO4
    clk_pin: GPIO5
    # e_pin omitted: your panel is 1/16 scan ("16S" on the panel label),
    # so the E row-select line isn't used.
    lambda: |-
      const int W = it.get_width();
      const int H = it.get_height();
      it.fill(Color(0, 0, 0));  // blank frame first (writer does not auto-clear)

      // Font = "Font" (family) x "Text Size" -- the *default* style, in effect
      // until a ":font=..:" / ":size=..:" token (see below) overrides it.
      using FontPtr = std::remove_const<decltype(id(font_roboto_m))>::type;
      auto font_for = [&](const std::string &face, const std::string &sz) -> FontPtr {
        if (face == "mono")
          return (sz == "small") ? id(font_mono_s)
               : (sz == "large") ? id(font_mono_l) : id(font_mono_m);
        if (face == "slab")
          return (sz == "small") ? id(font_slab_s)
               : (sz == "large") ? id(font_slab_l) : id(font_slab_m);
        return (sz == "small") ? id(font_roboto_s)
             : (sz == "large") ? id(font_roboto_l) : id(font_roboto_m);
      };
      std::string face = id(text_font).current_option().str();
      std::string sz = id(text_size).current_option().str();

      // --- Inline icons ------------------------------------------------------
      // Text is walked as UTF-8 codepoints. A codepoint in the icon table renders
      // as a full-color image; every other codepoint renders as a font glyph. So
      // an icon sits in the text flow -- "BTC :btc: 100k" draws the roundel inline.
      //
      // ICON_TOKENS maps a typeable ASCII token to that codepoint, so the panel can
      // be driven from HA without entering literal Unicode. Codepoints live in the
      // Private Use Area (U+E000..), which is what it exists for.
      static const struct { const char *tok; const char *cp; } ICON_TOKENS[] = {
        { ":btc:", "\xEE\x80\x80" },   // U+E000 -- Bitcoin roundel (see the image: block)
      };
      const int ICON_PAD = 1;    // px of breathing room each side of an icon

      // Emoji tokens: an ASCII token maps to a real Unicode emoji codepoint (the
      // font extras above pull each one in from Noto Emoji). Unlike ICON_TOKENS,
      // these are ordinary glyphs, not images -- icon_for() never sees them, so
      // they fall straight through to the normal glyph draw path and follow the
      // Text Color gradient like any other character.
      static const struct { const char *tok; const char *cp; } EMOJI_TOKENS[] = {
        { ":smile:",      "\xF0\x9F\x99\x82" },  // U+1F642 slightly smiling face
        { ":sad:",        "\xF0\x9F\x99\x81" },  // U+1F641 slightly frowning face
        { ":cry:",        "\xF0\x9F\x98\xA2" },  // U+1F622 crying face
        { ":heart:",      "\xE2\x9D\xA4" },      // U+2764  heavy black heart
        { ":thumbsup:",   "\xF0\x9F\x91\x8D" },  // U+1F44D thumbs up sign
        { ":thumbsdown:", "\xF0\x9F\x91\x8E" },  // U+1F44E thumbs down sign
        { ":sun:",        "\xE2\x98\x80" },      // U+2600  black sun with rays
        { ":cloud:",      "\xE2\x98\x81" },      // U+2601  cloud
        { ":rain:",       "\xE2\x98\x94" },      // U+2614  umbrella with rain drops
      };

      // Image for an icon codepoint at the current Text Size; nullptr = not an icon.
      auto icon_for = [&](uint32_t cp) -> esphome::image::Image * {
        switch (cp) {
          case 0xE000:
            return (sz == "small") ? id(icon_btc_s)
                 : (sz == "large") ? id(icon_btc_l) : id(icon_btc_m);
          default:
            return nullptr;
        }
      };

      // Decode the codepoint at s[i], advancing i past it. A malformed byte eats one
      // byte and yields U+FFFD, so bad input can never desync the walk or loop.
      auto next_cp = [](const std::string &s, size_t &i) -> uint32_t {
        uint8_t c = (uint8_t) s[i];
        uint32_t cp;
        int extra;
        if (c < 0x80) { cp = c; extra = 0; }
        else if ((c & 0xE0) == 0xC0) { cp = c & 0x1Fu; extra = 1; }
        else if ((c & 0xF0) == 0xE0) { cp = c & 0x0Fu; extra = 2; }
        else if ((c & 0xF8) == 0xF0) { cp = c & 0x07u; extra = 3; }
        else { i++; return 0xFFFD; }
        if (i + (size_t) extra >= s.size()) { i++; return 0xFFFD; }
        for (int k = 1; k <= extra; k++) {
          uint8_t cc = (uint8_t) s[i + (size_t) k];
          if ((cc & 0xC0) != 0x80) { i++; return 0xFFFD; }
          cp = (cp << 6) | (uint32_t) (cc & 0x3Fu);
        }
        i += (size_t) extra + 1;
        return cp;
      };

      // Per-character style, set by inline ":key=value:" tokens (see STYLE_TOKENS
      // parsing below) and carried alongside the text through wrap/measure/draw so
      // a single "Display Text" string can mix fonts, gradients, flash rates and
      // local brightness -- e.g. "Price :gb: {{ states(...) }}" switches to
      // Gradient B partway through, inline, no separate entity needed.
      struct Style { FontPtr font; int gset; float flash_s; float bright; };

      // Text laid out with a Style attached to every byte (1:1 with the bytes in
      // .s, repeated across a codepoint's continuation bytes). Every helper below
      // takes/returns SText instead of std::string so style always travels with
      // the text it colors, through substr/append/word-wrap alike.
      struct SText {
        std::string s;
        std::vector<Style> st;
        void push(char c, const Style &sty) { s.push_back(c); st.push_back(sty); }
        bool empty() const { return s.empty(); }
        void clear() { s.clear(); st.clear(); }
      };

      // Width of t in px, counting icons by their image width, each codepoint
      // measured with its own style's font. Every width below goes through here,
      // so wrap, scroll span and gradient all agree on one number.
      auto measure = [&](const SText &t) -> int {
        int w = 0;
        size_t i = 0;
        while (i < t.s.size()) {
          size_t start = i;
          auto *ic = icon_for(next_cp(t.s, i));
          if (ic != nullptr) { w += ic->get_width() + 2 * ICON_PAD; continue; }
          int bx, by, cw, ch;
          it.get_text_bounds(0, 0, t.s.substr(start, i - start).c_str(), t.st[start].font,
                             TextAlign::TOP_LEFT, &bx, &by, &cw, &ch);
          w += cw;
        }
        return w;
      };

      std::string text = id(display_text).state;
      if (text.empty()) return;

      // ":btc:" -> U+E000, so the rest of the lambda only ever sees codepoints.
      for (const auto &t : ICON_TOKENS) {
        size_t at = 0;
        size_t tlen = strlen(t.tok), clen = strlen(t.cp);
        while ((at = text.find(t.tok, at)) != std::string::npos) {
          text.replace(at, tlen, t.cp);
          at += clen;
        }
      }

      // ":smile:" -> U+1F642, etc, so HA can drive emoji without literal Unicode.
      for (const auto &t : EMOJI_TOKENS) {
        size_t at = 0;
        size_t tlen = strlen(t.tok), clen = strlen(t.cp);
        while ((at = text.find(t.tok, at)) != std::string::npos) {
          text.replace(at, tlen, t.cp);
          at += clen;
        }
      }

      // Gradient stops: each "Text Color N" (gradient A) / "Text Color BN"
      // (gradient B) light contributes a stop while it is on, in order 1..3.
      // A gradient with 0 stops on renders as black (invisible on the black
      // background) wherever it is the active style -- see shade() below.
      float sr[2][3], sg[2][3], sb[2][3];
      int ns[2] = {0, 0};
      auto add_stop = [&](int g, auto *ls) {
        auto v = ls->current_values;
        if (v.get_state() > 0.5f) {            // on/off (transitions are instant)
          float s = v.get_brightness();         // per-stop intensity
          int k = ns[g];
          sr[g][k] = v.get_red() * s; sg[g][k] = v.get_green() * s; sb[g][k] = v.get_blue() * s;
          ns[g]++;
        }
      };
      add_stop(0, id(text_color_1));
      add_stop(0, id(text_color_2));
      add_stop(0, id(text_color_3));
      add_stop(1, id(text_color_b1));
      add_stop(1, id(text_color_b2));
      add_stop(1, id(text_color_b3));
      if (ns[0] == 0 && ns[1] == 0) return;     // both gradients off -> blank

      // Color at t in [0,1] interpolated across gradient g's active stops, scaled
      // by the style's local ":bright=N:" (default 100%, independent of the panel-
      // wide "Brightness" number, which is the hardware PWM/safety-capped level).
      auto shade = [&](float t, const Style &sty) -> Color {
        if (t < 0) t = 0;
        if (t > 1) t = 1;
        int g = sty.gset;
        int n = ns[g];
        float r = 0, gg = 0, b = 0;
        if (n > 0) {
          float pos = (n == 1) ? 0.0f : t * (float) (n - 1);
          int i = (int) pos;
          if (i > n - 1) i = n - 1;
          int j = (i + 1 < n) ? i + 1 : i;
          float f = pos - (float) i;
          r = sr[g][i] + (sr[g][j] - sr[g][i]) * f;
          gg = sg[g][i] + (sg[g][j] - sg[g][i]) * f;
          b = sb[g][i] + (sb[g][j] - sb[g][i]) * f;
        }
        float k = sty.bright;
        return Color((uint8_t) lroundf(r * k * 255.0f),
                     (uint8_t) lroundf(gg * k * 255.0f),
                     (uint8_t) lroundf(b * k * 255.0f));
      };

      // Draw one line: walk it a codepoint at a time, drawing icons as images and
      // everything else as glyphs, each using its own style's font/gradient/flash,
      // colored by its horizontal center across the line (the gradient).
      auto draw_line = [&](int x0, int y, const SText &t, bool center_v) {
        TextAlign al = center_v ? TextAlign::CENTER_LEFT : TextAlign::TOP_LEFT;
        int lw = measure(t);
        if (lw <= 0) return;
        int cx = 0;
        size_t i = 0;
        while (i < t.s.size()) {
          size_t start = i;
          const Style &sty = t.st[start];
          bool vis = true;
          if (sty.flash_s > 0.01f) {
            float phase = fmodf(millis() / 1000.0f, sty.flash_s);
            vis = phase < sty.flash_s * 0.5f;    // "off" half -> skip drawing
          }
          auto *ic = icon_for(next_cp(t.s, i));
          if (ic != nullptr) {
            int iw = ic->get_width() + 2 * ICON_PAD;
            if (vis) {
              float tp = (cx + iw * 0.5f) / (float) lw;
              // A color image ignores the color argument; a 1-bit icon would be
              // tinted by the gradient here, exactly like text.
              it.image(x0 + cx + ICON_PAD,
                       center_v ? (y - ic->get_height() / 2) : y,
                       ic, shade(tp, sty), Color::BLACK);
            }
            cx += iw;
            continue;
          }
          std::string one = t.s.substr(start, i - start);   // one whole codepoint
          int cbx, cby, cw, chh;
          it.get_text_bounds(0, 0, one.c_str(), sty.font, al, &cbx, &cby, &cw, &chh);
          if (vis) {
            float tp = (cx + cw * 0.5f) / (float) lw;
            it.print(x0 + cx, y, sty.font, shade(tp, sty), al, one.c_str());
          }
          cx += cw;
        }
      };

      // --- Inline style tokens -------------------------------------------------
      // ":br:" forces a line break (typed as two ASCII chars, since the HA "Display
      // Text" box is single-line and can't hold a literal newline); it is folded to
      // '\n' here so it reuses the existing word-wrap line-break handling untouched.
      // ":ga:"/":gb:" switch the active gradient (Text Color 1/2/3 vs Text Color
      // B1/B2/B3). ":font=roboto|mono|slab:" / ":size=small|medium|large:" switch
      // the active font, matching the "Font"/"Text Size" select options exactly.
      // ":flash=N:" sets this style's blink period in seconds (0 = steady).
      // ":bright=N:" (0-100) locally dims this style's gradient output.
      // An unrecognized ":...:" (including a stray colon in ordinary text, e.g. a
      // clock "3:30") is left as literal text rather than consumed.
      Style cur{font_for(face, sz), 0, id(flash_interval).state, 1.0f};
      SText body;
      {
        size_t i = 0;
        while (i < text.size()) {
          if (text[i] == ':') {
            size_t end = text.find(':', i + 1);
            if (end != std::string::npos && end > i + 1) {
              std::string tok = text.substr(i + 1, end - i - 1);
              bool known = true;
              if (tok == "br") body.push('\n', cur);
              else if (tok == "ga") cur.gset = 0;
              else if (tok == "gb") cur.gset = 1;
              else if (tok == "font=roboto") { face = "roboto"; cur.font = font_for(face, sz); }
              else if (tok == "font=mono")   { face = "mono";   cur.font = font_for(face, sz); }
              else if (tok == "font=slab")   { face = "slab";   cur.font = font_for(face, sz); }
              else if (tok == "size=small")  { sz = "small";    cur.font = font_for(face, sz); }
              else if (tok == "size=medium") { sz = "medium";   cur.font = font_for(face, sz); }
              else if (tok == "size=large")  { sz = "large";    cur.font = font_for(face, sz); }
              else if (tok.rfind("flash=", 0) == 0) {
                cur.flash_s = strtof(tok.c_str() + 6, nullptr);
              } else if (tok.rfind("bright=", 0) == 0) {
                float pct = strtof(tok.c_str() + 7, nullptr);
                if (pct < 0) pct = 0;
                if (pct > 100) pct = 100;
                cur.bright = pct / 100.0f;
              } else known = false;
              if (known) { i = end + 1; continue; }
            }
          }
          body.push(text[i], cur);
          i++;
        }
      }

      // Line height: tallest glyph/icon used anywhere in the message, applied
      // uniformly to every wrapped line (a per-line height would need a second
      // wrap pass; this is simpler and fine for the short strings this panel shows).
      int th = 1;
      {
        size_t i = 0;
        while (i < body.s.size()) {
          size_t start = i;
          auto *ic = icon_for(next_cp(body.s, i));
          if (ic != nullptr) { if (ic->get_height() > th) th = ic->get_height(); continue; }
          int bx, by, cw, ch;
          it.get_text_bounds(0, 0, body.s.substr(start, i - start).c_str(), body.st[start].font,
                             TextAlign::TOP_LEFT, &bx, &by, &cw, &ch);
          if (ch > th) th = ch;
        }
      }
      int tw = measure(body);

      if (id(word_wrap).state) {
        // Greedy word wrap into lines no wider than the panel (honors '\n').
        std::vector<SText> lines;
        SText line, word;
        size_t i = 0;
        while (true) {
          bool end = (i >= body.s.size());
          char c = end ? ' ' : body.s[i];
          Style sty = end ? cur : body.st[i];
          if (c == ' ' || c == '\n') {
            if (!word.empty()) {
              SText cand;
              if (line.empty()) {
                cand = word;
              } else {
                cand = line;
                cand.push(' ', word.st.front());
                cand.s += word.s;
                cand.st.insert(cand.st.end(), word.st.begin(), word.st.end());
              }
              if (measure(cand) > W && !line.empty()) { lines.push_back(line); line = word; }
              else line = cand;
              word.clear();
            }
            if (c == '\n') { lines.push_back(line); line.clear(); }
          } else {
            word.push(c, sty);
          }
          if (end) break;
          i++;
        }
        if (!line.empty()) lines.push_back(line);

        int total = (int) lines.size() * th;
        float vspeed = id(vscroll_speed).state;
        if (total > H && vspeed > 0.0f) {
          // Too tall -> scroll vertically, drawing a second copy for a seamless loop.
          int span = total + th;               // blank gap (one line) before repeat
          int voff = (int) fmodf(millis() / 1000.0f * vspeed, (float) span);
          for (int copy = 0; copy < 2; copy++) {
            int base = -voff + copy * span;
            for (size_t k = 0; k < lines.size(); k++)
              draw_line(0, base + (int) k * th, lines[k], false);
          }
        } else {
          // Fits (or vscroll off): vertically centered, top-aligned lines.
          int y0 = (total < H) ? (H - total) / 2 : 0;
          for (size_t k = 0; k < lines.size(); k++)
            draw_line(0, y0 + (int) k * th, lines[k], false);
        }
      } else if (tw <= W) {
        // Fits on one line: vertically centered, left-aligned.
        draw_line(0, H / 2, body, true);
      } else {
        // Wider than the panel: scroll horizontally at hscroll_speed px/s.
        float speed = id(hscroll_speed).state;
        int span = tw + W;                     // blank gap (panel width) before repeat
        int off = 0;
        if (speed > 0.0f)
          off = (int) fmodf(millis() / 1000.0f * speed, (float) span);
        draw_line(-off, H / 2, body, true);
        draw_line(-off + span, H / 2, body, true);  // second copy -> seamless loop
      }

# Home Assistant controls (entity ids are number./text./select./switch./light.
# matrix_display_<mac>_<slug>):
#   Display Text          (text)   -- the string to show. Everything below is one
#                                     ":token:" mini-language, ASCII only, so the
#                                     whole thing fits the single-line HA text box:
#                                       :btc:                    Bitcoin roundel (full-color image)
#                                       :smile: :sad: :cry: :heart: :thumbsup:
#                                       :thumbsdown: :sun: :cloud: :rain:
#                                                                Unicode emoji, rendered as text glyphs
#                                       :br:                     forced line break (a literal
#                                                                newline in the string works too,
#                                                                but is not typeable in the HA box)
#                                       :ga: / :gb:              switch active gradient: Text Color
#                                                                1/2/3 (A) vs Text Color B1/2/3 (B)
#                                       :font=roboto|mono|slab:  switch font family
#                                       :size=small|medium|large: switch font size
#                                       :flash=N:                blink period in seconds for
#                                                                subsequent text (0 = steady)
#                                       :bright=N:               0-100, locally dims subsequent
#                                                                text (independent of the panel-
#                                                                wide Brightness number below)
#                                     A token stays in effect until overridden by another token of
#                                     the same kind (:ga:/:gb:, :font=.., :size=.., :flash=.., or
#                                     :bright=..) -- there is no "reset to default" token, so end a
#                                     styled run by switching back explicitly, e.g. "...:gb: X :ga: Y".
#                                     Tokens do not create a line break by themselves (except :br:):
#                                     "Hello :gb: World" flows as one line/word-wrap unit, just with
#                                     "World" in gradient B, per the same wrap/scroll rules as plain text.
#                                     An unrecognized ":...:" (e.g. a clock "3:30") is left as literal text.
#   Brightness            (number) -- 0-100% panel brightness (HA owns any dimming)
#   Brightness In (s)     (number) -- fade-up duration to a higher brightness (0 = instant)
#   Brightness Out (s)    (number) -- fade-down duration to a lower brightness (0 = instant)
#   Text Color 1/2/3      (light)  -- gradient A stops: each on light adds a stop in
#                                     order (1 on = solid; 2-3 on = gradient across
#                                     the text). All off = that gradient renders black.
#   Text Color B1/2/3      (light) -- gradient B stops, same rules as gradient A; selected by
#                                     the ":gb:" token. Default off (see on_boot below), so text
#                                     never mentioning ":gb:" is unaffected.
#   Font                  (select) -- roboto | mono | slab (default; overridable per-run via :font=)
#   Text Size             (select) -- small | medium | large (default; overridable via :size=)
#   Word Wrap             (switch) -- on: wrap to lines; off: horizontal scroll if wide
#   Flash Interval        (number) -- seconds per blink cycle; 0 = steady (default; overridable via :flash=)
#   Horizontal Scroll Speed (number) -- px/s when a line is wider than the panel
#   Vertical Scroll Speed   (number) -- px/s when wrapped text is taller than the
#                                       panel (Word Wrap must be on)
# Examples:
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "{{ states('sensor.front_door') }}"}
#
#   action: light.turn_on
#   target: {entity_id: light.matrix_display_<mac>_text_color_1}
#   data: {rgb_color: [255, 136, 0]}
#
#   # inline icon: text, roundel, text -- the icon sits in the text flow and
#   # scales with Text Size
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "BTC :btc: {{ states('sensor.btc_price') }}"}
#
#   # emoji token -- renders as a text glyph, same gradient as surrounding text
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "Door open :sad:"}
#
#   # mixed styling: "Price" in the default gradient/font, the value in gradient B
#   # and mono, a forced break, then a small flashing warning
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "Price :gb::font=mono: {{ states('sensor.btc_price') }} :ga::font=roboto: :br: :size=small::flash=0.5: LOW BATTERY"}
# Brightness fade state (pixel value 0-255). apply_brightness sets a new target;
# the fade interval ramps bright_current toward it over "Brightness In"/"Out".
globals:
  - id: bright_current
    type: float
    restore_value: no
    initial_value: '${matrix_brightness_boot}'
  - id: bright_target
    type: float
    restore_value: no
    initial_value: '${matrix_brightness_boot}'
  - id: bright_start
    type: float
    restore_value: no
    initial_value: '${matrix_brightness_boot}'
  - id: bright_t0
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bright_dur
    type: float
    restore_value: no
    initial_value: '0'
  - id: text_colors_initialized
    type: bool
    restore_value: yes
    initial_value: 'false'

interval:
  # Ramp the applied pixel brightness toward the target each tick. A whole
  # transition takes "Brightness In" seconds when rising / "Brightness Out" when
  # falling (0 = instant). pixel_brightness is republished only on integer change.
  - interval: 40ms
    then:
      - lambda: |-
          float target = id(bright_target);
          float cur = id(bright_current);
          if (cur == target) return;
          float b;
          float dur = id(bright_dur);
          if (dur <= 0.0f) {
            b = target;
          } else {
            float elapsed = (millis() - id(bright_t0)) / 1000.0f;
            float f = elapsed / dur;
            if (f >= 1.0f) b = target;
            else b = id(bright_start) + (target - id(bright_start)) * f;
          }
          uint8_t prev = (uint8_t) lroundf(cur);
          uint8_t bi = (uint8_t) lroundf(b);
          id(bright_current) = b;
          id(matrix_display).set_brightness(bi);
          if (bi != prev) id(pixel_brightness).publish_state(bi);

script:
  - id: apply_brightness
    parameters:
      percent: float
    then:
      - lambda: |-
          // Set a new brightness target and start a fade toward it. The 0-100%
          // level maps to a 0-cap pixel value (cap is the hardware safety
          // ceiling). "Brightness In" is the fade-up time, "Brightness Out" the
          // fade-down time; the fade interval does the ramp.
          float p = percent;
          if (p < 0.0f) p = 0.0f;
          if (p > 100.0f) p = 100.0f;
          const float cap = ${matrix_brightness_cap};
          float target = p / 100.0f * cap;
          id(bright_start) = id(bright_current);
          id(bright_target) = target;
          id(bright_t0) = millis();
          id(bright_dur) = (target >= id(bright_current)) ? id(bright_in_s).state
                                                          : id(bright_out_s).state;

text:
  - platform: template
    name: "Display Text"
    id: display_text
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 128
    initial_value: "iotstack - ${friendly_name}"
    on_value:
      # Redraw immediately so text changes are not delayed to the next update tick.
      - component.update: matrix_display

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    optimistic: true
    restore_value: true
    initial_value: ${matrix_brightness_default_pct}
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - script.execute:
          id: apply_brightness
          percent: !lambda 'return x;'
  - platform: template
    name: "Brightness In (s)"
    id: bright_in_s
    icon: "mdi:transition"
    optimistic: true
    restore_value: true
    initial_value: 2.5
    min_value: 0
    max_value: 30
    step: 0.1
    unit_of_measurement: "s"
    mode: box  # seconds to fade UP to a higher brightness; 0 = instant
  - platform: template
    name: "Brightness Out (s)"
    id: bright_out_s
    icon: "mdi:transition"
    optimistic: true
    restore_value: true
    initial_value: 2.5
    min_value: 0
    max_value: 30
    step: 0.1
    unit_of_measurement: "s"
    mode: box  # seconds to fade DOWN to a lower brightness; 0 = instant
  - platform: template
    name: "Flash Interval"
    id: flash_interval
    icon: "mdi:flash"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: "s"
    mode: box  # seconds per blink cycle; 0 = steady (no flashing)
  - platform: template
    name: "Horizontal Scroll Speed"
    id: hscroll_speed
    icon: "mdi:arrow-right-thin"
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "px/s"
    mode: box  # scroll rate when a single line is wider than the panel; 0 = static
  - platform: template
    name: "Vertical Scroll Speed"
    id: vscroll_speed
    icon: "mdi:arrow-down-thin"
    optimistic: true
    restore_value: true
    initial_value: 8
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "px/s"
    # Only applies with Word Wrap on: scrolls when wrapped text is taller than the
    # panel. 0 = static (tall text is clipped).
    mode: box

# Text color as up to three gradient stops, each an HA color-wheel light. The
# template outputs are no-op sinks -- colors are read live in the display lambda
# via current_values, not driven onto any pin. All three default on, giving an
# orange -> red -> purple gradient out of the box (see the on_boot color init
# below, which sets these RGB defaults once on a fresh flash).
#
# Text Color B1/B2/B3 below are a second, independent gradient (gradient B),
# selected inline in "Display Text" via the ":gb:" token (":ga:" switches back
# to this gradient). Same rules: 0 on = renders black, 1 on = solid, 2-3 on =
# gradient. Defaults to cyan -> blue -> green (see on_boot).
output:
  - platform: template
    type: float
    id: tc1_r
    write_action: []
