substitutions:
  device_role: "matrixdisplay"
  friendly_name: "Matrix Display"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC BOOT button
  heartbeat_interval: "10s"   # bootstrap-only aliveness beacon (see interval: below)
  # Brightness: HA sends a 0-100% level via the "Brightness" number; the device
  # maps it linearly to pixel brightness. HA owns any adaptive/dimming curve --
  # compute the percentage from its own sensors + user preference, then push it.
  matrix_brightness_cap: "170"          # Pixel brightness (0-255) at 100% -- hardware safety ceiling
  matrix_brightness_default_pct: "50"   # Startup brightness percentage (Brightness number initial_value)
  matrix_brightness_boot: "85"          # Display brightness at power-on, before on_boot applies the %
  project_version: "0.0.0"

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager, matrix_hub75]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml
  esphome_base: !include common/esphome_base.yaml
  sntp_time: !include common/sntp_time.yaml

esphome:
  name: matrixdisplay
  on_boot:
    - priority: 600
      then:
        - script.execute:
            id: apply_brightness
            percent: !lambda 'return id(brightness_pct).state;'

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 16MB


psram:
  mode: octal
 

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

logger:
  hardware_uart: USB_SERIAL_JTAG

# Font face x size, chosen at runtime via the "Font" and "Text Size" selects.
# 3 families (Roboto sans / Roboto Mono / Roboto Slab) x 3 sizes (8/14/20).
font:
  - file: "gfonts://Roboto"
    id: font_roboto_s
    size: 8
  - file: "gfonts://Roboto"
    id: font_roboto_m
    size: 14
  - file: "gfonts://Roboto"
    id: font_roboto_l
    size: 20
  - file: "gfonts://Roboto+Mono"
    id: font_mono_s
    size: 8
  - file: "gfonts://Roboto+Mono"
    id: font_mono_m
    size: 14
  - file: "gfonts://Roboto+Mono"
    id: font_mono_l
    size: 20
  - file: "gfonts://Roboto+Slab"
    id: font_slab_s
    size: 8
  - file: "gfonts://Roboto+Slab"
    id: font_slab_m
    size: 14
  - file: "gfonts://Roboto+Slab"
    id: font_slab_l
    size: 20

# Pin mapping below is for RGB Matrix Adapter Board (E) Rev 2.2 by Seengreat,
# wired to a genuine ESP32-S3-DevKitC-1 module.
#
# Verified compatible by physical inspection on 2026-06-16:
#   - Adapter board silkscreen confirmed: "RGB Matrix Adapter Board (E)
#     Rev 2.2" (Seengreat)
#   - ESP32-S3 module confirmed standard DevKitC-1 pin layout/labeling
#     (module marked S3-N16R8, WiFi+BT)
# Pin mapping source: https://seengreat.com/wiki/186/rgb-matrix-adapter-board-e
# (Rev 2.2 corresponds to the "V2.x" table on that page for the
# ESP32-S3-DevKitC-1 wiring diagram.)
display:
  # matrix_hub75 reads panel layout + dimensions from NVS at boot (see write-nvs-secrets.sh).
  # HUB75 panels cannot self-report; set via:
  #   iotstack flash ... --horizontal-panel-count=2 --vertical-panel-count=1 etc.
  - platform: matrix_hub75
    id: matrix_display
    # ~25 fps so horizontal scroll and flashing animate smoothly.
    update_interval: 40ms
    panel_width: 64
    panel_height: 32
    max_layout_cols: 2       # panels side by side
    default_layout_cols: 1
    max_layout_rows: 2       # panels stacked top-to-bottom
    default_layout_rows: 1
    brightness: ${matrix_brightness_boot}
    r1_pin: GPIO18
    g1_pin: GPIO8
    b1_pin: GPIO17
    r2_pin: GPIO16
    g2_pin: GPIO1
    b2_pin: GPIO15
    a_pin: GPIO7
    b_pin: GPIO48
    c_pin: GPIO6
    d_pin: GPIO47
    lat_pin: GPIO21
    oe_pin: GPIO4
    clk_pin: GPIO5
    # e_pin omitted: your panel is 1/16 scan ("16S" on the panel label),
    # so the E row-select line isn't used.
    lambda: |-
      const int W = it.get_width();
      const int H = it.get_height();
      it.fill(Color(0, 0, 0));  // blank frame first (writer does not auto-clear)

      // Font = "Font" (family) x "Text Size".
      std::string face = id(text_font).state;
      std::string sz = id(text_size).state;
      auto *fnt = id(font_roboto_m);
      if (face == "mono")
        fnt = (sz == "small") ? id(font_mono_s)
            : (sz == "large") ? id(font_mono_l) : id(font_mono_m);
      else if (face == "slab")
        fnt = (sz == "small") ? id(font_slab_s)
            : (sz == "large") ? id(font_slab_l) : id(font_slab_m);
      else
        fnt = (sz == "small") ? id(font_roboto_s)
            : (sz == "large") ? id(font_roboto_l) : id(font_roboto_m);

      // No text yet -> show the panel geometry (white), no effects.
      std::string text = id(display_text).state;
      if (text.empty()) {
        it.printf(0, H / 2, fnt, TextAlign::CENTER_LEFT, "%dx%d", W, H);
        return;
      }

      // Flash: blank the text for the second half of each interval (0 = steady).
      float flash_s = id(flash_interval).state;
      if (flash_s > 0.01f) {
        float phase = fmodf(millis() / 1000.0f, flash_s);
        if (phase >= flash_s * 0.5f) return;  // "off" half -> leave blank
      }

      // Gradient stops: each "Text Color N" light contributes a stop while it is
      // on, in order 1..3. 0 -> nothing to draw; 1 -> solid; 2-3 -> gradient.
      float sr[3], sg[3], sb[3];
      int n = 0;
      auto add_stop = [&](auto *ls) {
        auto v = ls->current_values;
        if (v.get_state() > 0.5f) {           // on/off (transitions are instant)
          float s = v.get_brightness();        // per-stop intensity
          sr[n] = v.get_red() * s; sg[n] = v.get_green() * s; sb[n] = v.get_blue() * s;
          n++;
        }
      };
      add_stop(id(text_color_1));
      add_stop(id(text_color_2));
      add_stop(id(text_color_3));
      if (n == 0) return;                      // all color stops off -> blank

      // Color at t in [0,1] interpolated across the active stops.
      auto grad = [&](float t) -> Color {
        if (t < 0) t = 0;
        if (t > 1) t = 1;
        float pos = (n == 1) ? 0.0f : t * (float) (n - 1);
        int i = (int) pos;
        if (i > n - 1) i = n - 1;
        int j = (i + 1 < n) ? i + 1 : i;
        float f = pos - (float) i;
        float r = sr[i] + (sr[j] - sr[i]) * f;
        float g = sg[i] + (sg[j] - sg[i]) * f;
        float b = sb[i] + (sb[j] - sb[i]) * f;
        return Color((uint8_t) lroundf(r * 255.0f),
                     (uint8_t) lroundf(g * 255.0f),
                     (uint8_t) lroundf(b * 255.0f));
      };
      Color solid = grad(0.0f);

      // Draw one line. Solid color -> a single print; gradient (n>=2) -> per
      // character, colored by its horizontal center across the line's width.
      auto draw_line = [&](int x0, int y, const std::string &s, bool center_v) {
        TextAlign al = center_v ? TextAlign::CENTER_LEFT : TextAlign::TOP_LEFT;
        if (n == 1) { it.print(x0, y, fnt, solid, al, s.c_str()); return; }
        int bx, by, lw, lh;
        it.get_text_bounds(0, 0, s.c_str(), fnt, al, &bx, &by, &lw, &lh);
        if (lw <= 0) { it.print(x0, y, fnt, solid, al, s.c_str()); return; }
        int cx = 0;
        for (size_t k = 0; k < s.size(); k++) {
          char buf[2] = { s[k], 0 };           // ASCII-only content (project rule)
          int cbx, cby, cw, chh;
          it.get_text_bounds(0, 0, buf, fnt, al, &cbx, &cby, &cw, &chh);
          float t = (cx + cw * 0.5f) / (float) lw;
          it.print(x0 + cx, y, fnt, grad(t), al, buf);
          cx += cw;
        }
      };

      // Height of one line for this font.
      int bx, by, tw, th;
      it.get_text_bounds(0, 0, text.c_str(), fnt, TextAlign::TOP_LEFT,
                         &bx, &by, &tw, &th);

      if (id(word_wrap).state) {
        // Greedy word wrap into lines no wider than the panel (honors '\n').
        std::vector<std::string> lines;
        std::string line, word;
        size_t i = 0;
        while (true) {
          bool end = (i >= text.size());
          char c = end ? ' ' : text[i];
          if (c == ' ' || c == '\n') {
            if (!word.empty()) {
              std::string cand = line.empty() ? word : line + " " + word;
              int cbx, cby, cw, chh;
              it.get_text_bounds(0, 0, cand.c_str(), fnt, TextAlign::TOP_LEFT,
                                 &cbx, &cby, &cw, &chh);
              if (cw > W && !line.empty()) { lines.push_back(line); line = word; }
              else line = cand;
              word.clear();
            }
            if (c == '\n') { lines.push_back(line); line.clear(); }
          } else {
            word += c;
          }
          if (end) break;
          i++;
        }
        if (!line.empty()) lines.push_back(line);

        int total = (int) lines.size() * th;
        float vspeed = id(vscroll_speed).state;
        if (total > H && vspeed > 0.0f) {
          // Too tall -> scroll vertically, drawing a second copy for a seamless loop.
          int span = total + th;               // blank gap (one line) before repeat
          int voff = (int) fmodf(millis() / 1000.0f * vspeed, (float) span);
          for (int copy = 0; copy < 2; copy++) {
            int base = -voff + copy * span;
            for (size_t k = 0; k < lines.size(); k++)
              draw_line(0, base + (int) k * th, lines[k], false);
          }
        } else {
          // Fits (or vscroll off): vertically centered, top-aligned lines.
          int y0 = (total < H) ? (H - total) / 2 : 0;
          for (size_t k = 0; k < lines.size(); k++)
            draw_line(0, y0 + (int) k * th, lines[k], false);
        }
      } else if (tw <= W) {
        // Fits on one line: vertically centered, left-aligned.
        draw_line(0, H / 2, text, true);
      } else {
        // Wider than the panel: scroll horizontally at hscroll_speed px/s.
        float speed = id(hscroll_speed).state;
        int span = tw + W;                     // blank gap (panel width) before repeat
        int off = 0;
        if (speed > 0.0f)
          off = (int) fmodf(millis() / 1000.0f * speed, (float) span);
        draw_line(-off, H / 2, text, true);
        draw_line(-off + span, H / 2, text, true);  // second copy -> seamless loop
      }

# Home Assistant controls (entity ids are number./text./select./switch./light.
# matrix_display_<mac>_<slug>):
#   Display Text          (text)   -- the string to show
#   Brightness            (number) -- 0-100% panel brightness (HA owns any dimming)
#   Text Color 1/2/3      (light)  -- gradient stops: each on light adds a stop in
#                                     order (1 on = solid; 2-3 on = gradient across
#                                     the text). All off = blank.
#   Font                  (select) -- roboto | mono | slab
#   Text Size             (select) -- small | medium | large
#   Word Wrap             (switch) -- on: wrap to lines; off: horizontal scroll if wide
#   Flash Interval        (number) -- seconds per blink cycle; 0 = steady
#   Horizontal Scroll Speed (number) -- px/s when a line is wider than the panel
#   Vertical Scroll Speed   (number) -- px/s when wrapped text is taller than the
#                                       panel (Word Wrap must be on)
# Examples:
#   action: text.set_value
#   target: {entity_id: text.matrix_display_<mac>_display_text}
#   data: {value: "{{ states('sensor.front_door') }}"}
#
#   action: light.turn_on
#   target: {entity_id: light.matrix_display_<mac>_text_color_1}
#   data: {rgb_color: [255, 136, 0]}
script:
  - id: apply_brightness
    parameters:
      percent: float
    then:
      - lambda: |-
          // Map a 0-100% level to a 0-cap pixel brightness (cap is the hardware
          // safety ceiling). HA is responsible for any adaptive dimming.
          float p = percent;
          if (p < 0.0f) p = 0.0f;
          if (p > 100.0f) p = 100.0f;
          const float cap = ${matrix_brightness_cap};
          uint8_t b = (uint8_t) lroundf(p / 100.0f * cap);
          id(matrix_display).set_brightness(b);
          id(pixel_brightness).publish_state(b);

text:
  - platform: template
    name: "Display Text"
    id: display_text
    mode: text
    optimistic: true
    restore_value: true
    min_length: 0
    max_length: 128
    initial_value: ""
    on_value:
      # Redraw immediately so text changes are not delayed to the next update tick.
      - component.update: matrix_display

number:
  - platform: template
    name: "Brightness"
    id: brightness_pct
    optimistic: true
    restore_value: true
    initial_value: ${matrix_brightness_default_pct}
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - script.execute:
          id: apply_brightness
          percent: !lambda 'return x;'
  - platform: template
    name: "Flash Interval"
    id: flash_interval
    icon: "mdi:flash"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: "s"
    mode: box  # seconds per blink cycle; 0 = steady (no flashing)
  - platform: template
    name: "Horizontal Scroll Speed"
    id: hscroll_speed
    icon: "mdi:arrow-right-thin"
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "px/s"
    mode: box  # scroll rate when a single line is wider than the panel; 0 = static
  - platform: template
    name: "Vertical Scroll Speed"
    id: vscroll_speed
    icon: "mdi:arrow-down-thin"
    optimistic: true
    restore_value: true
    initial_value: 8
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "px/s"
    # Only applies with Word Wrap on: scrolls when wrapped text is taller than the
    # panel. 0 = static (tall text is clipped).
    mode: box

# Text color as up to three gradient stops, each an HA color-wheel light. The
# template outputs are no-op sinks -- colors are read live in the display lambda
# via current_values, not driven onto any pin. Colors 2 and 3 default off, so the
# out-of-box look is solid white (stop 1 only).
output:
  - platform: template
    type: float
    id: tc1_r
    write_action: []
  - platform: template
    type: float
    id: tc1_g
    write_action: []
  - platform: template
    type: float
    id: tc1_b
    write_action: []
  - platform: template
    type: float
    id: tc2_r
    write_action: []
  - platform: template
    type: float
    id: tc2_g
    write_action: []
  - platform: template
    type: float
    id: tc2_b
    write_action: []
  - platform: template
    type: float
    id: tc3_r
    write_action: []
  - platform: template
    type: float
    id: tc3_g
    write_action: []
  - platform: template
    type: float
    id: tc3_b
    write_action: []

light:
  - platform: rgb
    name: "Text Color 1"
    id: text_color_1
    red: tc1_r
    green: tc1_g
    blue: tc1_b
    restore_mode: RESTORE_DEFAULT_ON   # solid white text out of the box
    default_transition_length: 0s      # color changes apply instantly
    gamma_correct: 0                    # linear -> lambda math stays predictable
  - platform: rgb
    name: "Text Color 2"
    id: text_color_2
    red: tc2_r
    green: tc2_g
    blue: tc2_b
    restore_mode: RESTORE_DEFAULT_OFF  # off -> not a gradient stop
    default_transition_length: 0s
    gamma_correct: 0
  - platform: rgb
    name: "Text Color 3"
    id: text_color_3
    red: tc3_r
    green: tc3_g
    blue: tc3_b
    restore_mode: RESTORE_DEFAULT_OFF  # off -> not a gradient stop
    default_transition_length: 0s
    gamma_correct: 0

select:
  - platform: template
    name: "Font"
    id: text_font
    icon: "mdi:format-font"
    optimistic: true
    restore_value: true
    options: ["roboto", "mono", "slab"]
    initial_option: "roboto"
    on_value:
      - component.update: matrix_display
  - platform: template
    name: "Text Size"
    id: text_size
    icon: "mdi:format-size"
    optimistic: true
    restore_value: true
    options: ["small", "medium", "large"]
    initial_option: "medium"
    on_value:
      - component.update: matrix_display

switch:
  - platform: template
    name: "Word Wrap"
    id: word_wrap
    icon: "mdi:wrap"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - component.update: matrix_display
    turn_off_action:
      - component.update: matrix_display

sensor:
  - platform: template
    name: "Pixel Brightness"
    id: pixel_brightness
    icon: "mdi:brightness-6"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
    # Actual applied pixel value; published by apply_brightness (0 until on_boot runs).
    lambda: 'return 0;'

text_sensor:
  # object_id "panel_count" is the horizontal count and is also read by the CLI
  # (esphome_text_sensors.py); keep the name slugging to panel_count. "Panel Rows"
  # -> panel_rows is the vertical count.
  - platform: template
    name: "Panel Count"
    id: panel_count
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_layout_cols());
  - platform: template
    name: "Panel Rows"
    id: panel_rows
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_layout_rows());
  - platform: template
    name: "Matrix Panel Width"
    id: matrix_panel_width
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_panel_width());
  - platform: template
    name: "Matrix Panel Height"
    id: matrix_panel_height
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_panel_height());
  - platform: template
    name: "Matrix Display Size"
    id: matrix_display_size
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::to_string(id(matrix_display).get_display_width()) + "x" +
             std::to_string(id(matrix_display).get_display_height());