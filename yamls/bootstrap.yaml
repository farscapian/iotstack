# Universal Bootstrap Firmware - All ESP32 device roles (variant selected at flash time)
# This is the BOOTSTRAP image - deployed to a separate partition on all devices
# Use ONLY when production firmware is unavailable/broken
#
# Key features:
# - Works for ALL device roles (bleproxy, mmwave, threadrouter, etc.)
# - Device-specific OTA password from NVS (bootstrap-derived, unique per device)
# - Minimal functionality to save flash space
# - Single firmware binary for all devices (secrets from NVS)
# - Can OTA flash any production firmware back
#
# WARNING: Do NOT use this as production firmware!

substitutions:
  development_status: "prod"
  bootstrap_role: "bootstrap"  # overridden at render from IOTSTACK_BOOTSTRAP_ROLE
  device_role: "${bootstrap_role}"
  friendly_name: "Bootstrap Mode"  # overridden at render via iotstack_bootstrap_friendly_name
  heartbeat_interval: "5s"   # bootstrap-only aliveness beacon (see interval: below)
  bootstrap_mdns_service_base: "_iotstack-bootstrap"  # overridden at render
  # Chip profile -- overridden in yamls/.iotstack-bootstrap-<variant>.yaml at flash time
  chip_variant: esp32c6
  chip_board: seeed_xiao_esp32c6
  chip_flash_size: 4MB
  chip_framework: esp-idf
  boot_button_pin: GPIO9  # overridden per chip in .iotstack-bootstrap-<variant>.yaml
  project_version: "0.0.0-dev"  # overridden at compile time from git tag

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Boot-button / restart / partition-toggle (no switch_to_bootstrap -- already on bootstrap)
packages:
  partition_mgmt: !include common/partition_manager_bootstrap.yaml
  boot_button: !include common/boot_button.yaml

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}-${development_status}"
    version: "${project_version}"
  includes:
    - common/mdns_remove.h
  on_boot:
    # Low priority (-100) runs AFTER all components have set up, so the
    # [nvs_secrets] setup() logs print first. The delay gives you time to
    # attach `esphome logs` / a serial monitor right after plugging in, so
    # the NVS boot summary below is easy to catch instead of scrolling past.
    priority: -100
    then:
      - delay: 10s
      - logger.log:
          format: "[NVS-DEBUG] Boot summary follows. Device secrets are read from NVS at startup; see the [nvs_secrets] lines above for what loaded."
          level: INFO

esp32:
  board: ${chip_board}
  framework:
    type: ${chip_framework}
  flash_size: ${chip_flash_size}
  variant: ${chip_variant}
  # PARTITION TABLE CONFIGURATION
  # Includes: bootloader, app0 (bootstrap), app1 (production), nvs
  # NVS partition at 0x3d000 (24KB) for device-specific secrets
  partitions: iotstack_partition_table.csv

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
# YAML does not contain any secrets - all come from device flash (NVS)
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component
  power_save_mode: none
  # Reboot if WiFi fails to connect within 3 minutes on any boot.
  reboot_timeout: 3min
  on_connect:
    - lambda: |-
        // Remove _esphomelib._tcp so HA does not auto-discover bootstrap devices.
        // iotstack finds bootstrap devices via _iotstack-bootstrap._tcp (see mdns: below).
        mdns_service_remove("_esphomelib", "_tcp");

# Advertise a bootstrap-specific mDNS service so iotstack can discover bootstrap
# devices without Home Assistant auto-discovering and offering to onboard them.
mdns:
  services:
    - service: "${bootstrap_mdns_service_base}"
      protocol: "_tcp"
      port: 6053
      txt:
        friendly_name: !lambda 'return App.get_friendly_name();'
        project_name: !lambda 'return ESPHOME_PROJECT_NAME;'
        config_hash: !lambda 'return str_sprintf("%08x", App.get_config_hash());'
        bootstrap_image_hash: !lambda 'return id(partition_mgr).get_bootstrap_image_hash();'
        production_image_hash: !lambda 'return id(partition_mgr).get_production_image_hash();'
        project_version: "${project_version}"

api:
  # No API encryption key for bootstrap -- only iotstack tools connect to it.
  # Production images use prod_api_key from NVS for HA API authentication.
  services:
    # Write NVS secrets without USB (iotstack preferred path). Pass only the keys
    # you want to change; empty string = leave unchanged. Includes matrix_cols,
    # matrix_panel_w, matrix_panel_h for matrixdisplay layout updates.
    # Device reboots automatically after commit. Bootstrap firmware only.
    - service: update_nvs_secrets
      variables:
        wifi_ssid: string
        wifi_password: string
        ota_password: string
        api_key: string
        thread_tlv: string
        matrix_cols: string
        matrix_panel_w: string
        matrix_panel_h: string
        device_role: string
      then:
        - lambda: |-
            id(nvs).update_secrets(wifi_ssid, wifi_password, ota_password, api_key, thread_tlv,
              matrix_cols, matrix_panel_w, matrix_panel_h, device_role);
        - delay: 500ms
        - lambda: |-
            App.safe_reboot();

# Custom NVS secrets component - loads device-specific secrets from NVS at startup
# Handles: WiFi credentials, OTA password, API encryption key
# All secrets are unique per device and stored in device flash (NVS partition)
nvs_secrets:
  id: nvs

# OTA Configuration for bootstrap partition
# Password is dynamically set by nvs_secrets component from NVS
# Each device has a unique OTA password derived at flash time
ota:
  - platform: esphome

# Boot button, restart button and partition-toggle button come from the shared
# partition_manager package (see packages: above).

binary_sensor:
  - platform: status
    name: "Connection Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI (dBm)"
    update_interval: 60s
    entity_category: diagnostic

# Aliveness beacon (bootstrap only). Lets `iotstack logs` confirm the device is
# alive and in bootstrap without a reboot; the free-heap reading also surfaces a
# slow leak. Interval is the heartbeat_interval substitution above.
interval:
  - interval: ${heartbeat_interval}
    then:
      - lambda: |-
          ESP_LOGI("heartbeat", "bootstrap alive - up %us, free heap %u B",
                   (unsigned) (millis() / 1000), (unsigned) esp_get_free_heap_size());

logger:
  level: DEBUG  # Enhanced logging to debug NVS issues
  hardware_uart: USB_SERIAL_JTAG
  logs:
    nvs_secrets: DEBUG
    wifi: DEBUG
    api: DEBUG