# BLE Proxy Recovery Firmware - WiFi Only (C6 Device)
# This is the RECOVERY image - deployed to a separate partition
# Use ONLY when production firmware is unavailable/broken
#
# Key differences from production:
# - Hardcoded recovery OTA password (never changes)
# - Hardcoded recovery API encryption key (never changes)
# - Minimal functionality (no Bluetooth proxy to save flash)
# - Distinctive LED indicator (purple blink = recovery mode)
# - Can OTA flash production firmware back
#
# WARNING: Do NOT use this as production firmware!
# WARNING: Recovery credentials are well-known - only use this to recover!

substitutions:
  device_role: "bleproxy-recovery"
  friendly_name: "Bluetooth Proxy (Recovery)"
  # Well-known recovery credentials (NEVER CHANGE THESE - documented security)
  recovery_ota_password: "IotstackRecovery2024"
  recovery_api_key: "IotstackRecoveryAPIKey2024"

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}"
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      # Recovery mode boot sequence: purple blinking LED
      - output.turn_on: onboard_led_output
      - delay: 500ms
      - output.turn_off: onboard_led_output
      - delay: 500ms
      - output.turn_on: onboard_led_output
      - delay: 500ms
      - output.turn_off: onboard_led_output

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6
  # PARTITION TABLE CONFIGURATION
  # Custom partition table for dual-app OTA recovery
  # See partition_table.csv in project root
  # partitions: custom:partitions/dual_app_recovery.csv

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: ${recovery_api_key}

# OTA Configuration for recovery partition
# This OTA block is for RECOVERY mode only
# Use recovery_ota_password to flash production firmware back
ota:
  - platform: esphome
    password: ${recovery_ota_password}

safe_mode:
  num_attempts: 3
  reboot_timeout: 2min

# Global variables for partition toggle
globals:
  - id: boot_button_pressed_time
    type: uint32_t
    initial_value: '0'
    restore_value: no

binary_sensor:
  - platform: status
    name: "Connection Status"

  # Boot button (GPIO0) on Seeed XIAO ESP32-C6
  # Hold for 3+ seconds to toggle between recovery/production partitions
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    name: "Partition Toggle Button"
    internal: true
    on_press:
      then:
        - lambda: |-
            id(boot_button_pressed_time) = millis();
            ESP_LOGI("PARTITION", "Boot button pressed - hold 3+ seconds to toggle partition");
    on_release:
      then:
        - lambda: |-
            uint32_t hold_time = millis() - id(boot_button_pressed_time);
            if (hold_time >= 3000) {
              ESP_LOGI("PARTITION", "Long press detected (%.1fs) - switching partition", hold_time/1000.0f);

              // Write OTA flags to switch partition
              // This tells bootloader to use alternate partition on next boot
              esp_ota_get_boot_partition();  // Get current partition info
              const esp_partition_t* running = esp_ota_get_running_partition();

              // Toggle to alternate partition
              const esp_partition_t* next;
              if (running->subtype == ESP_PARTITION_SUBTYPE_APP_OTA_0) {
                next = esp_partition_find_first(ESP_PARTITION_TYPE_APP, ESP_PARTITION_SUBTYPE_APP_OTA_1, NULL);
              } else {
                next = esp_partition_find_first(ESP_PARTITION_TYPE_APP, ESP_PARTITION_SUBTYPE_APP_OTA_0, NULL);
              }

              if (next != NULL) {
                esp_ota_set_boot_partition(next);
                ESP_LOGI("PARTITION", "Boot partition switched to: %s", next->label);
              } else {
                ESP_LOGE("PARTITION", "Failed to find alternate partition");
              }
            }

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI (dBm)"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
  - platform: factory_reset
    name: "Factory Reset"

  # Manual partition toggle button for HA integration
  - platform: template
    name: "Toggle Boot Partition"
    icon: "mdi:swap-horizontal"
    on_press:
      then:
        - lambda: |-
            // Manually toggle partition without holding physical button
            const esp_partition_t* running = esp_ota_get_running_partition();
            const esp_partition_t* next;

            if (running->subtype == ESP_PARTITION_SUBTYPE_APP_OTA_0) {
              next = esp_partition_find_first(ESP_PARTITION_TYPE_APP, ESP_PARTITION_SUBTYPE_APP_OTA_1, NULL);
            } else {
              next = esp_partition_find_first(ESP_PARTITION_TYPE_APP, ESP_PARTITION_SUBTYPE_APP_OTA_0, NULL);
            }

            if (next != NULL) {
              esp_ota_set_boot_partition(next);
              ESP_LOGI("PARTITION", "Boot partition toggled to: %s", next->label);
              // Flash LED 3 times to confirm
              for (int i = 0; i < 3; i++) {
                digitalWrite(15, LOW);   // LED on
                delay(200);
                digitalWrite(15, HIGH);  // LED off
                delay(200);
              }
            }

# Status LED - Onboard LED on XIAO ESP32-C6 (GPIO15, active-low)
# Purple blinking indicates recovery mode is active
output:
  - platform: gpio
    pin:
      number: GPIO15
      inverted: true
    id: onboard_led_output

logger:
  level: INFO  # Less verbose than production
  hardware_uart: USB_SERIAL_JTAG

# Recovery firmware notes:
# 1. This firmware is READ-ONLY in git (well-known creds)
# 2. Deploy to recovery partition (partition_table.csv)
# 3. Production firmware is on main partition
# 4. If production fails → falls back to recovery automatically
# 5. From recovery, OTA flash production firmware using recovery_ota_password
# 6. Device reboots into production
#
# Partition Toggle Feature (Manual Recovery Entry):
# - Physical method: Hold GPIO0 (boot button) for 3+ seconds
#   → Device switches to alternate partition and reboots
#   → Purple LED confirms toggle happened
# - HA method: Press "Toggle Boot Partition" button in Home Assistant
#   → Same effect, no physical access needed
#   → 3x LED flash confirms partition switched
#
# Partition Layout (ESP32-C6 4MB flash):
# 0x0000 - 0x20000:     Bootloader (128KB)
# 0x20000 - 0x24000:    Partition table (16KB)
# 0x24000 - 0x224000:   Recovery app partition (ota_0)
# 0x224000 - 0x424000:  Production app partition (ota_1)
# 0x424000 - 0x400000:  Unused/spare (reserved)
#
# Recovery Quick-Start:
# 1. Production firmware fails
# 2. Choose one method to enter recovery:
#    a) Wait for automatic fallback (5 boot attempts)
#    b) Hold GPIO0 button for 3+ seconds to manual switch
#    c) Press "Toggle Boot Partition" button in HA
# 3. Device boots recovery (purple LED blink pattern)
# 4. OTA flash production firmware:
#    esphome upload yamls/bleproxy.yaml \
#      --device <device>.local \
#      --ota-password IotstackRecovery2024
# 5. Device reboots into production
# 6. All done from computer - no device visits needed!
