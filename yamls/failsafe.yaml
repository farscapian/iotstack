# Universal Failsafe Firmware - All ESP32-C6 Device Roles
# This is the FAILSAFE image - deployed to a separate partition on all devices
# Use ONLY when production firmware is unavailable/broken
#
# Key features:
# - Works for ALL device roles (bleproxy, mmwave, threadrouter, etc.)
# - Device-specific OTA password from NVS (failsafe-derived, unique per device)
# - Minimal functionality to save flash space
# - Single firmware binary for all devices (secrets from NVS)
# - Can OTA flash any production firmware back
#
# WARNING: Do NOT use this as production firmware!

substitutions:
  development_status: "prod"
  dev_status: "${development_status}"
  device_role: "failsafe"
  friendly_name: "Failsafe Mode"
  heartbeat_interval: "5s"   # failsafe-only aliveness beacon (see interval: below)

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}-${dev_status}"
    version: "1.0.1"
  includes:
    - mdns_remove.h
  on_boot:
    # Low priority (-100) runs AFTER all components have set up, so the
    # [nvs_secrets] setup() logs print first. The delay gives you time to
    # attach `esphome logs` / a serial monitor right after plugging in, so
    # the NVS boot summary below is easy to catch instead of scrolling past.
    priority: -100
    then:
      - delay: 10s
      - logger.log:
          format: "[NVS-DEBUG] Boot summary follows. Device secrets are read from NVS at startup; see the [nvs_secrets] lines above for what loaded."
          level: INFO

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
  flash_size: 4MB
  variant: esp32c6
  # PARTITION TABLE CONFIGURATION
  # Includes: bootloader, app0 (failsafe), app1 (production), nvs
  # NVS partition at 0x3d000 (24KB) for device-specific secrets
  partitions: iotstack_partition_table.csv

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
# YAML does not contain any secrets - all come from device flash (NVS)
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component
  power_save_mode: none
  # Reboot if WiFi fails to connect within 3 minutes on any boot.
  reboot_timeout: 3min
  on_connect:
    - lambda: |-
        // Remove _esphomelib._tcp so HA does not auto-discover failsafe devices.
        // iotstack finds failsafe devices via _iotstack-failsafe._tcp (see mdns: below).
        mdns_service_remove("_esphomelib", "_tcp");

# Advertise a failsafe-specific mDNS service so iotstack can discover failsafe
# devices without Home Assistant auto-discovering and offering to onboard them.
mdns:
  services:
    - service: "_iotstack-failsafe"
      protocol: "_tcp"
      port: 6053

api:
  # No API encryption key for failsafe — only iotstack tools connect to it.
  # Production images use prod_api_key from NVS for HA API authentication.
  services:
    # Write new secrets to NVS without serial access.
    # Pass only the keys you want to change; empty string = leave unchanged.
    # Device reboots automatically after a successful commit so the new values
    # take effect on the next boot.  Only exposed in failsafe firmware.
    - service: update_nvs_secrets
      variables:
        wifi_ssid: string
        wifi_password: string
        ota_password: string
        api_key: string
        thread_tlv: string
      then:
        - lambda: |-
            id(nvs).update_secrets(wifi_ssid, wifi_password, ota_password, api_key, thread_tlv);
        - delay: 500ms
        - lambda: |-
            App.safe_reboot();

# Custom NVS secrets component - loads device-specific secrets from NVS at startup
# Handles: WiFi credentials, OTA password, API encryption key
# All secrets are unique per device and stored in device flash (NVS partition)
nvs_secrets:
  id: nvs

# OTA Configuration for failsafe partition
# Password is dynamically set by nvs_secrets component from NVS
# Each device has a unique OTA password derived at flash time
ota:
  - platform: esphome

safe_mode:
  num_attempts: 3
  reboot_timeout: 2min

# Boot button, restart button and partition-toggle button come from the shared
# partition_manager package (see packages: above).

binary_sensor:
  - platform: status
    name: "Connection Status"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi RSSI (dBm)"
    update_interval: 60s
    entity_category: diagnostic

# Aliveness beacon (failsafe only). Lets `iotstack logs` confirm the device is
# alive and in failsafe without a reboot; the free-heap reading also surfaces a
# slow leak. Interval is the heartbeat_interval substitution above.
interval:
  - interval: ${heartbeat_interval}
    then:
      - lambda: |-
          ESP_LOGI("heartbeat", "failsafe alive - up %us, free heap %u B",
                   (unsigned) (millis() / 1000), (unsigned) esp_get_free_heap_size());

logger:
  level: DEBUG  # Enhanced logging to debug NVS issues
  hardware_uart: USB_SERIAL_JTAG
  logs:
    nvs_secrets: DEBUG
    wifi: DEBUG
    api: DEBUG
