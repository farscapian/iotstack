substitutions:
  device_role: "sendspinspeaker"
  friendly_name: "SendSpin Speaker"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC-1 BOOT button
  project_version: "0.0.0"
  # I2S pins -> PCM5102A. Grouped here so a XIAO ESP32-S3 build can override
  # them without touching the rest of the config.
  i2s_bclk_pin: GPIO4
  i2s_lrclk_pin: GPIO5
  i2s_dout_pin: GPIO6

esphome:
  name: "sendspin"

# ESP32-S3-DevKitC-1 (N16R8): 16MB flash + 8MB octal PSRAM.
# The R8 PSRAM is what makes this role work properly -- see the sendspin/
# media_source sections below.
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# Leave speed at the ESPHome default (40MHz). Setting `speed: 80MHz` here boot-looped
# this board: ROM bootloader restarting on rst:0xc (RTC_SW_CPU_RST) with no ESPHome
# output at all, i.e. a panic in early PSRAM init. `mode: octal` is correct and proven
# (bootstrap.yaml and matrixdisplay.yaml run it on this same S3 DevKitC), so do not
# "optimize" the speed up without a device to test on.
psram:
  mode: octal

external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
#
# No ext_antenna package: like the XIAO ESP32-S3, the DevKitC-1 has no RF-switch
# GPIO -- its u.FL connector is wired directly, so the external antenna needs no
# config, just the pigtail. (Only the XIAO ESP32-C6 has an RF switch, and so is
# the only board needing common/xiao_c6_ext_antenna.yaml to steer RF to u.FL.)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml
  esphome_base: !include common/esphome_base.yaml
  sntp_time: !include common/sntp_time.yaml

# 1. Core services
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

# 2. WiFi -- power save disabled to keep audio stream stable
# WiFi credentials are loaded from NVS by nvs_secrets component at startup

wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component
  power_save_mode: none

# 3. Sendspin protocol hub
# Stream-handling task stack lives in PSRAM, freeing internal RAM for WiFi and
# the audio pipeline. (Requires the psram: block above -- ESPHome rejects
# task_stack_in_psram: true on a chip with no PSRAM configured.)

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# 4. I2S audio bus + speaker
# -- PCM5102A -> 3.5mm AUX -> powered/Bluetooth speaker ---------------------
#   PCM5102A    ESP32-S3-DevKitC-1
#   BCK       -> GPIO4  (bit clock)
#   LCK       -> GPIO5  (left/right clock)
#   DIN       -> GPIO6  (data)
#   VCC       -> 3.3V
#   GND       -> GND
#   SCK       -> GND    (internal clock mode -- check solder jumper on board)
#   3.5mm out -> AUX cable -> speaker
#
# Pin choice: GPIO4/5/6 are free, non-strapping, and adjacent on the header.
# Do NOT move these to GPIO35/36/37 -- on an R8 module those are consumed by the
# octal PSRAM. Also unavailable: GPIO0 (BOOT), GPIO19/20 (USB serial JTAG, which
# carries the logger above), GPIO26-32 (SPI flash).
#
# If your board's SCK jumper is NOT bridged to GND, uncomment i2s_mclk_pin.
# ---------------------------------------------------------------------------

i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin:  ${i2s_bclk_pin}
    i2s_lrclk_pin: ${i2s_lrclk_pin}
    # i2s_mclk_pin: GPIO7   # only needed if SCK jumper is not tied to GND

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_bus
    dac_type: external   # separate I2S DAC chip wired to dout/bclk/lrclk
    i2s_dout_pin: ${i2s_dout_pin}
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo

# 5. Media player + Sendspin source
# buffer_size is left at the 1 MB default: with 8 MB of PSRAM there is no reason
# to shrink it (the old 250 KB value was a workaround for the PSRAM-less C6).
# A deeper buffer is what rides out network hiccups without audible dropouts.
# Increase initial_static_delay if audio still glitches on a congested network.

media_player:
  - platform: speaker
    id: sendspin_player
    name: "Speaker"
    announcement_pipeline:
      speaker: i2s_speaker
      sample_rate: 16000

media_source:
  - platform: sendspin
    sendspin_id: sendspin_hub
    sample_rate: 48000
    task_stack_in_psram: true
    fixed_delay: 0ms
    initial_static_delay: 100ms
    static_delay_adjustable: true

# 6. Now-playing metadata from Sendspin server

text_sensor:
  - platform: sendspin
    name: "Now Playing"
    type: title
  - platform: sendspin
    name: "Artist"
    type: artist
  - platform: sendspin
    name: "Album"
    type: album

# 7. Sensors

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

# 8. Buttons -- "Restart" and "Toggle Boot Partition" come from partition_mgmt package
