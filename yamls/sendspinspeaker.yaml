substitutions:
  development_status: "dev"
  dev_status: "${development_status}"
  device_role: "sendspinspeaker"
  friendly_name: "SendSpin Speaker"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC BOOT button

esphome:
  name: "sendspin"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}-${dev_status}"
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

# 1. Core services
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Custom NVS secrets component - loads device-specific secrets from NVS
# (empty dict {} is required to instantiate the component)
nvs_secrets: {}

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

# OTA Configuration
# Password is dynamically set by nvs_secrets component from NVS
ota:
  - platform: esphome

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

time:
  - platform: sntp
    id: device_time

# 2. WiFi — power save disabled to keep audio stream stable
# WiFi credentials are loaded from NVS by nvs_secrets component at startup

wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component
  power_save_mode: none

# 3. Sendspin protocol hub
# task_stack_in_psram: false is required on ESP32-C6 (no PSRAM).

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

# 4. I2S audio bus + speaker
# ── PCM5102A → 3.5mm AUX → powered/Bluetooth speaker ─────────────────────
#   PCM5102A    XIAO ESP32-C6
#   BCK       → GPIO3  (bit clock)
#   LCK       → GPIO4  (left/right clock)
#   DIN       → GPIO5  (data)
#   VCC       → 3.3V
#   GND       → GND
#   SCK       → GND    (internal clock mode — check solder jumper on board)
#   3.5mm out → AUX cable → speaker
#
# If your board's SCK jumper is NOT bridged to GND, uncomment i2s_mclk_pin.
# ───────────────────────────────────────────────────────────────────────────

i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin:  GPIO3
    i2s_lrclk_pin: GPIO4
    # i2s_mclk_pin: GPIO2   # only needed if SCK jumper is not tied to GND

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_bus
    dac_type: external   # separate I2S DAC chip wired to dout/bclk/lrclk
    i2s_dout_pin: GPIO5
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo

# 5. Media player + Sendspin source
# buffer_size reduced from 1 MB default — ESP32-C6 internal RAM only.
# Increase initial_static_delay if audio glitches on network hiccups.

media_player:
  - platform: speaker
    id: sendspin_player
    name: "Speaker"
    announcement_pipeline:
      speaker: i2s_speaker
      sample_rate: 16000

media_source:
  - platform: sendspin
    sendspin_id: sendspin_hub
    sample_rate: 48000
    buffer_size: 250000
    fixed_delay: 0ms
    initial_static_delay: 100ms
    static_delay_adjustable: true

# 6. Now-playing metadata from Sendspin server

text_sensor:
  - platform: sendspin
    name: "Now Playing"
    type: title
  - platform: sendspin
    name: "Artist"
    type: artist
  - platform: sendspin
    name: "Album"
    type: album

# 7. Sensors

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

# 8. Buttons

button:
  # "Restart" and "Toggle Boot Partition" buttons come from partition_mgmt package
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config
