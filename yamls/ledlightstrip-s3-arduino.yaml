# SK6812 RGBW LED Strip -- WiFi end device (XIAO ESP32-S3, ARDUINO framework).
#
# Experimental A/B counterpart to ledlightstrip-s3.yaml (esp-idf). Same board and
# wiring; this one drives the strip with the neopixelbus platform on the Arduino
# framework -- the combo neopixelbus actually supports (it will NOT build under
# esp-idf). Use this to compare neopixelbus vs esp32_rmt_led_strip on real S3 hardware.
#
# Because the light platform + framework differ, this file does NOT include
# common/ledstrip_light.yaml; the strip block is inline below.

substitutions:
  development_status: "dev"
  device_role: "ledstrip-s3-arduino"
  friendly_name: "LED Light Strip S3 (Arduino)"
  project_version: "0.0.0-dev"
  boot_button_pin: GPIO0  # XIAO ESP32-S3 BOOT button
  strip_data_pin: GPIO1   # = D0 on XIAO ESP32-S3 silkscreen (via 330 Ohm series resistor to DIN)
  strip_num_leds: "300"
  strip_gamma: "2.8"
  strip_transition: "500ms"

# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior.
# No strip_light package here (that one is esp32_rmt_led_strip); no ext_antenna (S3).
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

esphome:
  name: ledstrip-s3-arduino
  friendly_name: ${friendly_name}
  project:
    name: "iotstack.${device_role}-${development_status}"
    version: "${project_version}"
  name_add_mac_suffix: true

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: arduino
  flash_size: 8MB

# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS

logger:
  # XIAO S3 USB-C is wired to the USB_SERIAL_JTAG pins. If the Arduino-framework
  # USB console misbehaves, switch to baud_rate: 115200 (UART0) for flashing/logs.
  hardware_uart: USB_SERIAL_JTAG

time:
  - platform: sntp
    id: device_time

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

# Onboard LED -- XIAO ESP32-S3 user LED GPIO21, active-low
output:
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    id: onboard_led_output

light:
  - platform: binary
    name: "Status LED"
    output: onboard_led_output
    id: status_led

  # SK6812 RGBW strip via neopixelbus (Arduino-only platform).
  # Wiring: ${strip_data_pin} -> 330 Ohm -> DIN; PSU 5V/20A -> strip VCC; 1000 uF cap at input.
  - platform: neopixelbus
    type: GRBW
    variant: SK6812
    pin: ${strip_data_pin}
    num_leds: ${strip_num_leds}
    name: "LED Strip 01"
    id: led_strip_01
    default_transition_length: ${strip_transition}
    gamma_correct: ${strip_gamma}
    restore_mode: RESTORE_AND_ON
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe
      - addressable_scan:
          name: Scan
      - addressable_twinkle:
          name: Twinkle
      - addressable_random_twinkle:
          name: Random Twinkle
      - addressable_fireworks:
          name: Fireworks
      - addressable_flicker:
          name: Flicker
