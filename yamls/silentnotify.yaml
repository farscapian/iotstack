substitutions:
  device_role: "silentnotify"
  friendly_name: "Silent Notify"
  boot_button_pin: GPIO0  # ESP32-S3-DevKitC BOOT button
  project_version: "0.0.0"

esphome:
  name: "${device_role}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}"
    version: "${project_version}"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

wifi:
  ssid: "configured-via-nvs"
  password: "placeholder"

api:

nvs_secrets:
  api_nvs_key: prod_api_key
