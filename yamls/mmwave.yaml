# ESP32-C6 WiFi mmWave Sensor

substitutions:
  device_role: "mmwave"
  friendly_name: "mmWave Presense Detector"

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}"
    version: "1.5.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# 1. Core services
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret mmwave_api_encryption_key
  on_client_connected:
    - if:
        condition:
          binary_sensor.is_on: presence
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 60%
              effect: "Pulse Heart Rate"
        else:
          - light.turn_on:
              id: rgb_led
              red: 0%
              green: 100%
              blue: 0%
              brightness: 60%
              transition_length: 500ms
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 50%
              blue: 0%
              brightness: 60%
              effect: "API Disconnected"

ota:
  - platform: esphome
    password: !secret mmwave_ota_password

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

time:
  - platform: sntp
    id: device_time

# 2. WiFi networking
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# 3. Hardware buses
uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: GPIO17
  tx_pin: GPIO16
  parity: NONE
  stop_bits: 1

i2c:
  id: bus_a
  sda: GPIO22
  scl: GPIO23
  scan: true

# 4. mmWave component
seeed_mr60bha2:
  id: my_mr60bha2
  uart_id: uart_bus

# 5. Sensors
binary_sensor:
  # Template driven from num_targets (drops to 0 immediately on no detection)
  # rather than has_target (which has a multi-minute hardware absence delay).
  # delayed_off: 20s provides a clean hold before clearing.
  # Internal: used only for LED automation, not shown in HA (see text_sensor below)
  - platform: template
    id: presence
    internal: true
    lambda: |-
      return id(target_count).has_state() && id(target_count).state > 0;
    filters:
      - delayed_off: 20s
    on_press:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 20%
                effect: "Pulse Heart Rate"
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Strobe Red Yellow"
    on_release:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: rgb_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 20%
                transition_length: 500ms
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Strobe Red Yellow"

  # Physical button (GPIO9 - boot button on Seeed XIAO)
  - platform: gpio
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    name: "Device Button"
    internal: true
    on_click:
      min_length: 50ms
      max_length: 350ms
      then:
        - script.execute: cycle_effect
    on_double_click:
      min_length: 50ms
      max_length: 350ms
      then:
        - button.press: restart_btn

text_sensor:
  - platform: template
    name: "Presence"
    lambda: |-
      return id(presence).state ? std::string("Detected") : std::string("Not Detected");
    update_interval: 1s

sensor:
  # 4.2 mmWave — respiratory rate
  - platform: seeed_mr60bha2
    mr60bha2_id: my_mr60bha2
    breath_rate:
      id: breath_rate_sensor
      name: "Respiratory Rate"
      device_class: ""
      unit_of_measurement: "brpm"
      state_class: measurement
      accuracy_decimals: 0


  # 4.3 mmWave — heart rate
  - platform: seeed_mr60bha2
    mr60bha2_id: my_mr60bha2
    heart_rate:
      id: heart_rate_sensor
      name: "Heart Rate"
      device_class: ""
      unit_of_measurement: "bpm"
      state_class: measurement
      accuracy_decimals: 0


  # 4.4 mmWave — detection distance
  - platform: seeed_mr60bha2
    mr60bha2_id: my_mr60bha2
    distance:
      name: "Detection Distance"
      unit_of_measurement: "ft"
      state_class: measurement
      accuracy_decimals: 2
      filters:
        - multiply: 0.0328084  # Convert cm to feet
    num_targets:
      name: "Target Count"
      id: target_count
      state_class: measurement

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # 4.1 BH1750 illuminance
  #   Resolution mode: defaults to HIGH_RES (1 lx, 120 ms measurement time)
  #   address: 0x23 (ADDR tied to GND on this carrier board)
  #   update_interval: 10s is a reasonable default; lower if you need faster response
  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    i2c_id: bus_a
    update_interval: 10s
    unit_of_measurement: lx
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 1


# 6. Global variable to track current effect
globals:
  - id: current_effect
    type: int
    initial_value: '0'
    restore_value: no

# 7. Buttons
button:
  - platform: template
    name: "Identify"
    icon: "mdi:led-on"
    entity_category: diagnostic
    on_press:
      - script.execute: identify_pulse
  - platform: restart
    id: restart_btn
    internal: true
  - platform: safe_mode
    id: safe_mode_btn
    internal: true
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config

# 7. RGB LED (onboard WS2812, GPIO1)
light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: "Status LED"
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      - lambda:
          name: "Pulse Heart Rate"
          update_interval: 100ms
          lambda: |-
            static uint32_t last_pulse_time = 0;
            static bool is_pulsing = false;

            // Check if heart rate is available (indicates human presence)
            if (!id(heart_rate_sensor).has_state()) {
              // No heart rate reading - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              is_pulsing = false;
              return;
            }

            // Get current heart rate from sensor
            float heart_rate = id(heart_rate_sensor).state;
            if (heart_rate <= 0) {
              // Invalid heart rate - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              is_pulsing = false;
              return;
            }

            // Calculate pulse interval in milliseconds (60000 / BPM)
            uint32_t pulse_interval = (uint32_t)(60000.0f / heart_rate);
            uint32_t transition_time = pulse_interval / 2;

            uint32_t now = millis();

            if (!is_pulsing && (now - last_pulse_time) >= pulse_interval) {
              // Start pulse
              is_pulsing = true;
              last_pulse_time = now;

              auto call = id(rgb_led).make_call();
              call.set_transition_length(transition_time);
              call.set_brightness(0.8);
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
              call.perform();
            } else if (is_pulsing && (now - last_pulse_time) >= transition_time) {
              // End pulse
              is_pulsing = false;

              auto call = id(rgb_led).make_call();
              call.set_transition_length(transition_time);
              call.set_brightness(0.2);
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
              call.perform();
            }
      - lambda:
          name: "Pulse Breath Rate"
          update_interval: 100ms
          lambda: |-
            static uint32_t last_pulse_time = 0;
            static bool is_pulsing = false;

            // Check if breath rate is available
            if (!id(breath_rate_sensor).has_state()) {
              // No breath rate - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              is_pulsing = false;
              return;
            }

            // Get current breath rate from sensor
            float breath_rate = id(breath_rate_sensor).state;
            if (breath_rate <= 0) {
              // Invalid breath rate - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              is_pulsing = false;
              return;
            }

            // Calculate pulse interval in milliseconds (60000 / BPM)
            uint32_t pulse_interval = (uint32_t)(60000.0f / breath_rate);
            uint32_t transition_time = pulse_interval / 2;

            uint32_t now = millis();

            if (!is_pulsing && (now - last_pulse_time) >= pulse_interval) {
              // Start pulse
              is_pulsing = true;
              last_pulse_time = now;

              auto call = id(rgb_led).make_call();
              call.set_transition_length(transition_time);
              call.set_brightness(0.8);
              call.set_red(0.0); call.set_green(1.0); call.set_blue(0.0);
              call.perform();
            } else if (is_pulsing && (now - last_pulse_time) >= transition_time) {
              // End pulse
              is_pulsing = false;

              auto call = id(rgb_led).make_call();
              call.set_transition_length(transition_time);
              call.set_brightness(0.2);
              call.set_red(0.0); call.set_green(1.0); call.set_blue(0.0);
              call.perform();
            }
      - lambda:
          name: "Strobe Red Yellow"
          update_interval: 250ms
          lambda: |-
            static bool is_red = true;
            auto call = id(rgb_led).make_call();
            call.set_brightness(1.0);
            if (is_red) {
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
            } else {
              call.set_red(1.0); call.set_green(1.0); call.set_blue(0.0);
            }
            call.set_transition_length(0);
            call.perform();
            is_red = !is_red;
      - lambda:
          name: "Wifi Disconnected"
          update_interval: 250ms
          lambda: |-
            static bool is_yellow = true;
            auto call = id(rgb_led).make_call();
            call.set_brightness(1.0);
            if (is_yellow) {
              call.set_red(1.0); call.set_green(1.0); call.set_blue(0.0);
            } else {
              call.set_red(0.0); call.set_green(0.0); call.set_blue(1.0);
            }
            call.set_transition_length(0);
            call.perform();
            is_yellow = !is_yellow;

# 8. Scripts
script:
  - id: cycle_effect
    mode: restart
    then:
      - lambda: |-
          int current = id(current_effect);
          current = (current + 1) % 2;  // Toggle between 0 and 1
          id(current_effect) = current;

          auto call = id(rgb_led).make_call();
          if (current == 0) {
            call.set_effect("Pulse Heart Rate");
          } else {
            call.set_effect("Pulse Breath Rate");
          }
          call.perform();

  - id: identify_pulse
    mode: restart
    then:
      - light.turn_on:
          id: rgb_led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%
          effect: "Pulse Heart Rate"
      - delay: 10s
      - light.turn_off:
          id: rgb_led
          transition_length: 300ms
      - if:
          condition:
            binary_sensor.is_on: presence
          then:
            - light.turn_on:
                id: rgb_led
                effect: "Pulse Heart Rate"
          else:
            - light.turn_off:
                id: rgb_led
