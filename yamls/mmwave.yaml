# ESP32-C6 WiFi mmWave Sensor

substitutions:
  device_role: "mmwave"
  friendly_name: "mmWave Presense Detector"
  project_version: "0.0.0"


# External components (replaces deprecated custom_components folder)
external_components:
  - source:
      type: local
      path: ./external_components
    components: [nvs_secrets, partition_manager]

# Shared boot-button / restart / partition-toggle behavior (same on every device)
packages:
  partition_mgmt: !include common/partition_manager.yaml
  boot_button: !include common/boot_button.yaml
  esphome_base: !include common/esphome_base.yaml
  sntp_time: !include common/sntp_time.yaml
  wifi_signal: !include common/wifi_signal.yaml
  ext_antenna: !include common/xiao_c6_ext_antenna.yaml

esphome:
  name: ${device_role}
  on_boot:
    # List form (note leading "-") so this concatenates with the on_boot the
    # ext_antenna package contributes, instead of one overriding the other.
    - priority: -100
      then:
        - light.turn_on:
            id: rgb_led
            red: 100%
            green: 0%
            blue: 0%
            brightness: 100%

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# 1. Core services
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

# Custom NVS secrets component - reads production-specific secrets from NVS
nvs_secrets:
  api_nvs_key: prod_api_key
  # Zero-trust, matches bootstrap.yaml: refuse to run/update without an active PSK
  require_api_encryption: true

api:
  # API encryption key is set dynamically by nvs_secrets component from NVS
  on_client_connected:
    - if:
        condition:
          binary_sensor.is_on: presence
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 60%
              effect: "Pulse Heart Rate"
        else:
          - light.turn_on:
              id: rgb_led
              red: 0%
              green: 100%
              blue: 0%
              brightness: 60%
              transition_length: 500ms
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 50%
              blue: 0%
              brightness: 60%
              effect: "Strobe Red Yellow"

# Status LED effects are controlled via the API / Home Assistant (light entity).

# 2. WiFi networking
# WiFi credentials are loaded from NVS by nvs_secrets component at startup
wifi:
  ssid: "configured-via-nvs"  # Placeholder - overridden by nvs_secrets component
  password: "placeholder"      # Placeholder - overridden by nvs_secrets component

# 3. Hardware buses
uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: GPIO17
  tx_pin: GPIO16
  parity: NONE
  stop_bits: 1

i2c:
  id: bus_a
  sda: GPIO22
  scl: GPIO23
  scan: true

# 4. mmWave component
seeed_mr60bha2:
  id: my_mr60bha2
  uart_id: uart_bus

# 5. Sensors
binary_sensor:
  # Template driven from num_targets (drops to 0 immediately on no detection)
  # rather than has_target (which has a multi-minute hardware absence delay).
  # delayed_off: 20s provides a clean hold before clearing.
  # Internal: used only for LED automation, not shown in HA (see text_sensor below)
  - platform: template
    id: presence
    internal: true
    lambda: |-
      return id(target_count).has_state() && id(target_count).state > 0;
    filters:
      - delayed_off: 20s
    on_press:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 20%
                effect: "Pulse Heart Rate"
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Strobe Red Yellow"
    on_release:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: rgb_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 20%
                transition_length: 500ms
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Strobe Red Yellow"

text_sensor:
  - platform: template
    name: "Presence"
    lambda: |-
      return id(presence).state ? std::string("Detected") : std::string("Not Detected");
    update_interval: 1s

  # Detection Distance, formatted per the "Distance Units" select. A sensor's
  # unit_of_measurement is fixed at compile time in this ESPHome build (no
  # runtime setter), so this is a text sensor rather than a numeric one.
  - platform: template
    name: "Detection Distance"
    icon: "mdi:tape-measure"
    update_interval: 1s
    lambda: |-
      if (!id(distance_raw_cm).has_state())
        return {};
      char buf[16];
      if (id(units_select).current_option() == "Metric") {
        snprintf(buf, sizeof(buf), "%.2f m", id(distance_raw_cm).state / 100.0f);
      } else {
        snprintf(buf, sizeof(buf), "%.2f ft", id(distance_raw_cm).state * 0.0328084f);
      }
      return std::string(buf);

  # EMA-smoothed counterpart of "Detection Distance" above, formatted the
  # same way per the "Distance Units" select. distance_ema (native cm) is
  # the internal state; see the distance_ema_sensor numeric sensor below.
  - platform: template
    name: "Detection Distance (EMA)"
    icon: "mdi:tape-measure"
    update_interval: 1s
    lambda: |-
      if (std::isnan(id(distance_ema)))
        return {};
      char buf[16];
      if (id(units_select).current_option() == "Metric") {
        snprintf(buf, sizeof(buf), "%.2f m", id(distance_ema) / 100.0f);
      } else {
        snprintf(buf, sizeof(buf), "%.2f ft", id(distance_ema) * 0.0328084f);
      }
      return std::string(buf);

sensor:
  # 4.2 mmWave -- respiratory rate
  - platform: seeed_mr60bha2
    mr60bha2_id: my_mr60bha2
    breath_rate:
      id: breath_rate_sensor
      name: "Respiratory Rate"
      device_class: ""
      unit_of_measurement: "brpm"
      state_class: measurement
      accuracy_decimals: 0
      # Time-based EMA (window tunable from HA) feeds the additive
      # breath_rate_ema_sensor below. Raw reading above is unchanged.
      on_value:
        - lambda: |-
            uint32_t now = millis();
            float tau = id(breath_rate_ema_window).state;
            if (std::isnan(id(breath_rate_ema))) {
              id(breath_rate_ema) = x;
            } else {
              float dt = (now - id(breath_rate_ema_last_ms)) / 1000.0f;
              float alpha = 1.0f - std::exp(-dt / tau);
              id(breath_rate_ema) = alpha * x + (1.0f - alpha) * id(breath_rate_ema);
            }
            id(breath_rate_ema_last_ms) = now;
            id(breath_rate_ema_sensor).publish_state(id(breath_rate_ema));


  # 4.3 mmWave -- heart rate
  - platform: seeed_mr60bha2
    mr60bha2_id: my_mr60bha2
    heart_rate:
      id: heart_rate_sensor
      name: "Heart Rate"
      device_class: ""
      unit_of_measurement: "bpm"
      state_class: measurement
      accuracy_decimals: 0
      # Time-based EMA (window tunable from HA) feeds the additive
      # heart_rate_ema_sensor below. Raw reading above is unchanged.
      on_value:
        - lambda: |-
            uint32_t now = millis();
            float tau = id(heart_rate_ema_window).state;
            if (std::isnan(id(heart_rate_ema))) {
              id(heart_rate_ema) = x;
            } else {
              float dt = (now - id(heart_rate_ema_last_ms)) / 1000.0f;
              float alpha = 1.0f - std::exp(-dt / tau);
              id(heart_rate_ema) = alpha * x + (1.0f - alpha) * id(heart_rate_ema);
            }
            id(heart_rate_ema_last_ms) = now;
            id(heart_rate_ema_sensor).publish_state(id(heart_rate_ema));


  # 4.4 mmWave -- detection distance
  # Raw reading stays internal (native cm); the "Detection Distance" text
  # sensor above is the only raw distance entity exposed to HA.
  - platform: seeed_mr60bha2
    mr60bha2_id: my_mr60bha2
    distance:
      id: distance_raw_cm
      internal: true
      unit_of_measurement: "cm"
      accuracy_decimals: 2
      # Time-based EMA (window tunable from HA) feeds the additive
      # distance_ema_sensor below. Raw reading above is unchanged.
      on_value:
        - lambda: |-
            uint32_t now = millis();
            float tau = id(distance_ema_window).state;
            if (std::isnan(id(distance_ema))) {
              id(distance_ema) = x;
            } else {
              float dt = (now - id(distance_ema_last_ms)) / 1000.0f;
              float alpha = 1.0f - std::exp(-dt / tau);
              id(distance_ema) = alpha * x + (1.0f - alpha) * id(distance_ema);
            }
            id(distance_ema_last_ms) = now;
            id(distance_ema_sensor).publish_state(id(distance_ema));
    num_targets:
      name: "Target Count"
      id: target_count
      state_class: measurement

  # 4.5 mmWave -- EMA-smoothed readings, additive alongside the raw
  # instantaneous sensors above. Time-based (not sample-count-based) so
  # smoothing stays correct despite the component's irregular push rate;
  # each window is independently tunable from HA via the EMA Window
  # number controls below.
  - platform: template
    id: breath_rate_ema_sensor
    name: "Respiratory Rate (EMA)"
    device_class: ""
    unit_of_measurement: "brpm"
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    id: heart_rate_ema_sensor
    name: "Heart Rate (EMA)"
    device_class: ""
    unit_of_measurement: "bpm"
    state_class: measurement
    accuracy_decimals: 1

  # Native-cm state backing the "Detection Distance (EMA)" text sensor
  # above; not itself exposed to HA (fixed cm unit would ignore the
  # "Distance Units" select).
  - platform: template
    id: distance_ema_sensor
    internal: true
    unit_of_measurement: "cm"
    state_class: measurement
    accuracy_decimals: 2

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  # 4.1 BH1750 illuminance
  #   Resolution mode: defaults to HIGH_RES (1 lx, 120 ms measurement time)
  #   address: 0x23 (ADDR tied to GND on this carrier board)
  #   update_interval: 10s is a reasonable default; lower if you need faster response
  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    i2c_id: bus_a
    update_interval: 10s
    unit_of_measurement: lx
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            // "Brightness Level" number > 0 pins the multiplier to a fixed
            // value, bypassing adaptive brightness entirely; 0 (default)
            // keeps the illuminance-based behavior below.
            float override_pct = id(brightness_override).state;
            if (override_pct > 0) {
              id(brightness_multiplier) = override_pct / 100.0f;
              return;
            }

            // Adaptive brightness based on illuminance
            // Dark room (0 lux) = 0.16x, bright daylight (10000+ lux) = 1.0x
            float lux = x;
            float multiplier;
            if (lux < 100) {
              multiplier = 0.16f;  // Very dark (20% reduction from 0.2)
            } else if (lux > 10000) {
              multiplier = 1.0f;  // Very bright
            } else {
              // Linear interpolation between 100-10000 lux (0.16-1.0 brightness)
              multiplier = 0.16f + ((lux - 100.0f) / 9900.0f) * 0.84f;
            }
            id(brightness_multiplier) = multiplier;


# 6. Global variables
globals:
  - id: brightness_multiplier
    type: float
    initial_value: '0.5'  # Default to 50%
    restore_value: no

  # EMA state (previous value + last-update timestamp) per smoothed metric.
  # NAN sentinel means "no reading yet"; seeded from the first raw reading.
  - id: breath_rate_ema
    type: float
    initial_value: 'NAN'
    restore_value: no
  - id: breath_rate_ema_last_ms
    type: uint32_t
    initial_value: '0'
    restore_value: no
  - id: heart_rate_ema
    type: float
    initial_value: 'NAN'
    restore_value: no
  - id: heart_rate_ema_last_ms
    type: uint32_t
    initial_value: '0'
    restore_value: no
  - id: distance_ema
    type: float
    initial_value: 'NAN'
    restore_value: no
  - id: distance_ema_last_ms
    type: uint32_t
    initial_value: '0'
    restore_value: no

# 7. Buttons
button:
  - platform: template
    name: "Identify"
    icon: "mdi:led-on"
    entity_category: diagnostic
    on_press:
      - script.execute: identify_pulse
  # "Restart" and "Toggle Boot Partition" buttons come from partition_mgmt package

# 7. Sensor Controls
# Disabled for now: raw UART writes here race with the seeed_mr60bha2
# component's own binary protocol on the same bus, and the switch is
# optimistic (no readback to confirm the sensor actually started/stopped).
# switch:
#   - platform: template
#     name: "Sensor Enabled"
#     id: sensor_enabled
#     icon: "mdi:radar"
#     entity_category: config
#     optimistic: true
#     turn_on_action:
#       - lambda: |-
#           id(uart_bus).write_str("sensorStart\r\n");
#           ESP_LOGI("SENSOR", "Sensor enabled");
#     turn_off_action:
#       - lambda: |-
#           id(uart_bus).write_str("sensorStop\r\n");
#           ESP_LOGI("SENSOR", "Sensor disabled");

# Metric/Imperial toggle, read by the "Detection Distance (Display)" text
# sensor above (polled every 1s, so the display catches up within a second).
select:
  - platform: template
    name: "Distance Units"
    id: units_select
    icon: "mdi:tape-measure"
    entity_category: config
    optimistic: true
    options:
      - "Imperial"
      - "Metric"
    initial_option: "Imperial"
    restore_value: true

# EMA smoothing windows, one per metric, independently tunable from HA
# (entity_category: config). Each is the exponential time constant in
# seconds -- e.g. 2-5s -- fed into the on_value lambdas above.
number:
  - platform: template
    name: "Respiratory Rate EMA Window"
    id: breath_rate_ema_window
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 3.0
    min_value: 1.0
    max_value: 15.0
    step: 0.5

  - platform: template
    name: "Heart Rate EMA Window"
    id: heart_rate_ema_window
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 3.0
    min_value: 1.0
    max_value: 15.0
    step: 0.5

  - platform: template
    name: "Detection Distance EMA Window"
    id: distance_ema_window
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 3.0
    min_value: 1.0
    max_value: 15.0
    step: 0.5

  # Manual override for the illuminance-based auto-brightness below.
  # 0 (default) = Adaptive Brightness; any other value pins the LED's
  # brightness multiplier to that fixed percentage instead.
  - platform: template
    name: "Brightness Level"
    id: brightness_override
    icon: "mdi:brightness-6"
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 5

# 7. RGB LED (onboard WS2812, GPIO1)
light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: "Status LED"
    pin: GPIO1
    num_leds: 1
    channel_colors: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      - lambda:
          name: "Off"
          update_interval: 1000ms
          lambda: |-
            auto call = id(rgb_led).make_call();
            call.set_state(false);
            call.perform();
      - lambda:
          name: "Pulse Heart Rate"
          update_interval: 100ms
          lambda: |-
            static uint32_t last_pulse_time = 0;
            static bool is_pulsing = false;

            // Check if heart rate is available (indicates human presence)
            if (!id(heart_rate_sensor).has_state()) {
              // No heart rate reading - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              is_pulsing = false;
              return;
            }

            // Get current heart rate from sensor
            float heart_rate = id(heart_rate_sensor).state;
            if (heart_rate <= 0) {
              // Invalid heart rate - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              is_pulsing = false;
              return;
            }

            // Calculate pulse interval in milliseconds (60000 / BPM)
            uint32_t pulse_interval = (uint32_t)(60000.0f / heart_rate);
            uint32_t transition_time = pulse_interval / 2;

            uint32_t now = millis();

            if (!is_pulsing && (now - last_pulse_time) >= pulse_interval) {
              // Start pulse
              is_pulsing = true;
              last_pulse_time = now;

              auto call = id(rgb_led).make_call();
              call.set_transition_length(transition_time);
              call.set_brightness(0.8 * id(brightness_multiplier));
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
              call.perform();
            } else if (is_pulsing && (now - last_pulse_time) >= transition_time) {
              // End pulse
              is_pulsing = false;

              auto call = id(rgb_led).make_call();
              call.set_transition_length(transition_time);
              call.set_brightness(0.2 * id(brightness_multiplier));
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
              call.perform();
            }
      - lambda:
          name: "Pulse Breath Rate"
          update_interval: 50ms
          lambda: |-
            // Check if breath rate is available
            if (!id(breath_rate_sensor).has_state()) {
              // No breath rate - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              return;
            }

            // Get current breath rate from sensor
            float breath_rate = id(breath_rate_sensor).state;
            if (breath_rate <= 0) {
              // Invalid breath rate - turn off LED
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              return;
            }

            // Calculate breath cycle time in milliseconds (60000 / BPM)
            float cycle_time = 60000.0f / breath_rate;

            // Get current position in breath cycle (0 to cycle_time)
            uint32_t now = millis();
            static uint32_t cycle_start = 0;
            if (cycle_start == 0) cycle_start = now;

            float cycle_pos = fmod((float)(now - cycle_start), cycle_time);
            float cycle_phase = cycle_pos / cycle_time;  // 0.0 to 1.0

            // Smooth sine wave for natural breathing (0.2 to 0.8 brightness)
            // sin(phase * pi) gives smooth 0->1->0 curve
            float sine_value = sin(cycle_phase * 3.14159265f);
            float brightness = (0.2f + (sine_value * 0.6f)) * id(brightness_multiplier);

            auto call = id(rgb_led).make_call();
            call.set_brightness(brightness);
            call.set_red(0.0); call.set_green(0.0); call.set_blue(1.0);
            call.set_transition_length(0);  // No transition, smooth via update_interval
            call.perform();
      - lambda:
          name: "Strobe Red Yellow"
          update_interval: 250ms
          lambda: |-
            static bool is_red = true;
            auto call = id(rgb_led).make_call();
            call.set_brightness(1.0 * id(brightness_multiplier));
            if (is_red) {
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
            } else {
              call.set_red(1.0); call.set_green(1.0); call.set_blue(0.0);
            }
            call.set_transition_length(0);
            call.perform();
            is_red = !is_red;
      - lambda:
          name: "Wifi Disconnected"
          update_interval: 250ms
          lambda: |-
            static bool is_yellow = true;
            auto call = id(rgb_led).make_call();
            call.set_brightness(1.0 * id(brightness_multiplier));
            if (is_yellow) {
              call.set_red(1.0); call.set_green(1.0); call.set_blue(0.0);
            } else {
              call.set_red(0.0); call.set_green(0.0); call.set_blue(1.0);
            }
            call.set_transition_length(0);
            call.perform();
            is_yellow = !is_yellow;
      - lambda:
          name: "Distance"
          update_interval: 100ms
          lambda: |-
            // Distance-based brightness (green color)
            // 6 inches (0.15m) = 100% bright, 20 feet (6.1m) = 10% bright
            // Reads the raw cm sensor (not the unit-toggleable Detection
            // Distance display sensor) so thresholds stay correct
            // regardless of the Distance Units dropdown.
            if (!id(distance_raw_cm).has_state()) {
              // No distance reading - turn off
              auto call = id(rgb_led).make_call();
              call.set_state(false);
              call.perform();
              return;
            }

            float distance = id(distance_raw_cm).state * 0.0328084f;  // cm to feet
            float min_dist = 0.5f;    // 6 inches
            float max_dist = 20.0f;   // 20 feet
            float min_brightness = 0.1f;  // 10% at far distance
            float max_brightness = 1.0f;  // 100% at close distance

            float brightness;
            if (distance <= min_dist) {
              brightness = max_brightness;  // Very close - full brightness
            } else if (distance >= max_dist) {
              brightness = min_brightness;  // Far - dim
            } else {
              // Linear interpolation between min and max
              float ratio = (distance - min_dist) / (max_dist - min_dist);
              brightness = max_brightness - (ratio * (max_brightness - min_brightness));
            }

            auto call = id(rgb_led).make_call();
            call.set_state(true);
            call.set_brightness(brightness * id(brightness_multiplier));
            call.set_red(0.0);
            call.set_green(1.0);
            call.set_blue(0.0);
            call.set_transition_length(100);
            call.perform();

# 8. Scripts
script:
  - id: identify_pulse
    mode: restart
    then:
      - light.turn_on:
          id: rgb_led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%
          effect: "Pulse Heart Rate"
      - delay: 10s
      - light.turn_off:
          id: rgb_led
          transition_length: 300ms
      - if:
          condition:
            binary_sensor.is_on: presence
          then:
            - light.turn_on:
                id: rgb_led
                effect: "Pulse Heart Rate"
          else:
            - light.turn_off:
                id: rgb_led
