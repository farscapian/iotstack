# ESP32-C6 WiFi mmWave Sensor

substitutions:
  device_role: "mmwave"
  friendly_name: "mmWave Human Presence Sensor"

esphome:
  name: ${device_role}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "iotstack.${device_role}"
    version: "1.4.2"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: rgb_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# 1. Core services
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret mmwave_api_encryption_key
  on_client_connected:
    - if:
        condition:
          binary_sensor.is_on: presence
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 0%
              blue: 0%
              brightness: 60%
              effect: "Pulse Red"
        else:
          - light.turn_on:
              id: rgb_led
              red: 0%
              green: 100%
              blue: 0%
              brightness: 60%
              transition_length: 500ms
  on_client_disconnected:
    - if:
        condition:
          not:
            api.connected:
        then:
          - light.turn_on:
              id: rgb_led
              red: 100%
              green: 50%
              blue: 0%
              brightness: 60%
              effect: "Pulse Yellow Red"

ota:
  - platform: esphome
    password: !secret mmwave_ota_password

safe_mode:
  num_attempts: 5
  reboot_timeout: 3min

time:
  - platform: sntp
    id: device_time

# 2. WiFi networking
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# 3. Hardware buses
uart:
  id: uart_bus
  baud_rate: 115200
  rx_pin: GPIO17
  tx_pin: GPIO16
  parity: NONE
  stop_bits: 1

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true

# 4. mmWave component
seeed_mr60bha2:
  id: mr60bha2
  uart_id: uart_bus

# 5. Sensors
binary_sensor:
  # Template driven from num_targets (drops to 0 immediately on no detection)
  # rather than has_target (which has a multi-minute hardware absence delay).
  # delayed_off: 20s provides a clean hold before clearing.
  - platform: template
    name: "Presence"
    id: presence
    lambda: |-
      return id(target_count).has_state() && id(target_count).state > 0;
    filters:
      - delayed_off: 20s
    on_press:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 20%
                effect: "Pulse Red"
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Pulse Yellow Red"
    on_release:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on:
                id: rgb_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 20%
                transition_length: 500ms
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Pulse Yellow Red"

sensor:
  # 4.2 mmWave — respiratory rate
  - platform: seeed_mr60bha2
    seeed_mr60bha2_id: my_mr60bha2
    breath_rate:
      name: "${friendly_name} Respiratory Rate"
      device_class: ""
      unit_of_measurement: "brpm"
      state_class: measurement
      accuracy_decimals: 0


  # 4.3 mmWave — heart rate
  - platform: seeed_mr60bha2
    seeed_mr60bha2_id: my_mr60bha2
    heart_rate:
      name: "${friendly_name} Heart Rate"
      device_class: ""
      unit_of_measurement: "bpm"
      state_class: measurement
      accuracy_decimals: 0


  # 4.4 mmWave — detection distance
  - platform: seeed_mr60bha2
    seeed_mr60bha2_id: my_mr60bha2
    distance:
      name: "${friendly_name} Detection Distance"
      unit_of_measurement: "m"
      state_class: measurement
      accuracy_decimals: 2

      
    num_targets:
      name: "Target Count"
      id: target_count

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  # 4.1 BH1750 illuminance
  #   Resolution mode: defaults to HIGH_RES (1 lx, 120 ms measurement time)
  #   address: 0x23 (ADDR tied to GND on this carrier board)
  #   update_interval: 10s is a reasonable default; lower if you need faster response
  - platform: bh1750
    name: "${friendly_name} Illuminance"
    address: 0x23
    i2c_id: bus_a
    update_interval: 10s
    unit_of_measurement: lx
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 1


# 7. Buttons
button:
  - platform: template
    name: "Identify"
    icon: "mdi:led-on"
    entity_category: diagnostic
    on_press:
      - script.execute: identify_pulse
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config

# 7. RGB LED (onboard WS2812, GPIO1)
light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: "Status LED"
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 600ms
          update_interval: 600ms
      - pulse:
          name: "Pulse Red"
          transition_length: 1500ms
          update_interval: 1800ms
          min_brightness: 20%
          max_brightness: 30%
      - lambda:
          name: "Pulse Yellow Red"
          update_interval: 1000ms
          lambda: |-
            static bool phase = false;
            auto call = id(rgb_led).make_call();
            call.set_transition_length(900);
            call.set_brightness(0.2);
            if (phase) {
              call.set_red(1.0); call.set_green(0.5); call.set_blue(0.0);
            } else {
              call.set_red(1.0); call.set_green(0.0); call.set_blue(0.0);
            }
            phase = !phase;
            call.perform();

# 8. Scripts
script:
  - id: identify_pulse
    mode: restart
    then:
      - light.turn_on:
          id: rgb_led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 100%
          effect: "Pulse"
      - delay: 10s
      - light.turn_off:
          id: rgb_led
          transition_length: 300ms
      - if:
          condition:
            api.connected:
          then:
            - if:
                condition:
                  binary_sensor.is_on: presence
                then:
                  - light.turn_on:
                      id: rgb_led
                      red: 100%
                      green: 0%
                      blue: 0%
                      brightness: 20%
                      effect: "Pulse Red"
                else:
                  - light.turn_on:
                      id: rgb_led
                      red: 0%
                      green: 100%
                      blue: 0%
                      brightness: 20%
                      transition_length: 500ms
          else:
            - light.turn_on:
                id: rgb_led
                red: 100%
                green: 50%
                blue: 0%
                brightness: 20%
                effect: "Pulse Yellow Red"
