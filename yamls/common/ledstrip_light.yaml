# Shared SK6812 RGBW addressable-strip definition for the esp-idf LED-strip
# profiles (XIAO C6 / Thread and XIAO S3 / WiFi). Included via packages:.
#
# The including board profile provides these substitutions and its own status
# LED + radio block:
#   strip_data_pin    data GPIO (C6 D0 = GPIO0, S3 D0 = GPIO1)
#   strip_num_leds    LED count
#   strip_gamma       gamma_correct exponent
#   strip_transition  default transition length
#
# esp32_rmt_led_strip is the native esp-idf addressable-LED driver. (neopixelbus
# is Arduino-only and was deprecated for ESP32 in ESPHome 2026.6 -- not used here.)
# is_rgbw: true drives the 4th (white) channel; rgb_order is the RGB part only
# (SK6812 = GRB + W).

light:
  - platform: esp32_rmt_led_strip
    chipset: SK6812
    rgb_order: GRB
    is_rgbw: true
    pin: ${strip_data_pin}
    num_leds: ${strip_num_leds}
    name: "LED Strip 01"
    id: led_strip_01
    default_transition_length: ${strip_transition}
    gamma_correct: ${strip_gamma}
    restore_mode: RESTORE_AND_ON
    effects:
      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe
      - addressable_scan:
          name: Scan
      - addressable_twinkle:
          name: Twinkle
      - addressable_random_twinkle:
          name: Random Twinkle
      - addressable_fireworks:
          name: Fireworks
      - addressable_flicker:
          name: Flicker
