# Shared partition_manager component and HA buttons (included by production and bootstrap).
packages:
  iotstack_mdns_meta: !include iotstack_mdns_meta.yaml

partition_manager:
  id: partition_mgr

# Runtime-adjustable log level, exposed to Home Assistant as a dropdown.
# ESPHome's built-in logger select: options are capped at the compiled
# `logger: level:` (see each role's logger block); nvs_secrets persists the
# chosen level to the "log_level" key in the iotstack NVS namespace and
# re-applies it on every boot, so it survives reboots and OTA updates without
# needing a recompile.
select:
  - platform: logger
    name: "Log Level"

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Toggle Boot Partition"
    icon: "mdi:swap-horizontal"
    # config: co-locate with the Restart button in HA's Configuration section
    # (the restart button platform defaults to entity_category config).
    entity_category: config
    on_press:
      then:
        - lambda: "id(partition_mgr).toggle_boot_partition();"