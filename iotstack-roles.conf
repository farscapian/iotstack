# iotstack-devices.conf
# Device role mappings for simplified CLI usage
#
# Format: DEVICE_ROLE=wifi_yaml:thread_yaml
# - wifi_yaml: path to WiFi device role (optional, leave empty if N/A)
# - thread_yaml: path to Thread device role (optional, leave empty if N/A)
# - Default device role is WiFi. Use --thread flag to switch.
#
# Example:
#   bleproxy=yamls/esp32c6-wifi-bleproxy.yaml:
#   mmwave=yamls/esp32c6-wifi-mmwave.yaml:
#   threadrouter=:yamls/esp32c6-thread-threadrouter.yaml
#
# Usage:
#   iotstack update bleproxy              # updates WiFi device role
#   iotstack update bleproxy --thread     # updates Thread device role
#   iotstack verify mmwave
#   iotstack list

# WiFi Devices
bleproxy=yamls/bleproxy.yaml:
mmwave=yamls/mmwave.yaml:
sendspin=yamls/sendspin.yaml:
ledstrip=yamls/ledstrip.yaml:

# Thread Devices
threadrouter=:yamls/threadrouter.yaml
